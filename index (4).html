<style>
/* =================================================================
   THE DESK — color-coded file folders on a black desk.
   Flat. No gradients, no shadows, no rounded corners except nothing.
   ================================================================= */
:root{
  --desk:#000000;
  --paper:#F8F5EF; --card:#FDFBF6; --rule:#D9D5CF; --rule2:#D9D5CF;
  --ink:#111111; --ink2:#5B5B5B; --ink3:#8A867E;
  --disp:'Oswald','Barlow Condensed',Impact,'Arial Narrow',sans-serif;
  --accent:#111111; --accent-ink:#F8F5EF;
  --sans:-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Arial,sans-serif;
  --plate:#0C0C0A; --plate-ink:#EDEAE0; --plate-line:#2A2A24;
  --red:#B23A2E; --green:#2E7D46; --orange:#C07019; --blue:#2C6E9E;
  --gray:#6F6F63; --purple:#6B4E9E; --teal:#2A8079; --brown:#8A5A2B;
  --sans:'Archivo',ui-sans-serif,system-ui,sans-serif;
  --mono:'JetBrains Mono',ui-monospace,monospace;
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
html,body{margin:0;padding:0}
body{background:var(--desk);color:var(--ink);font-family:var(--sans);font-size:14px;
  line-height:1.55;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;
  overscroll-behavior-y:none;touch-action:manipulation}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer;padding:0}
a{color:inherit;text-decoration:none}
h1{margin:0}p{margin:0}select,input,textarea{font:inherit}
::selection{background:#F6E3BE}
:focus-visible{outline:2px solid var(--orange);outline-offset:2px}
.grow{flex:1}
/* DISPLAY FACE — condensed, uppercase, for numbers/headlines/verdicts only */
.lede h1,.ph2,.ptitle,.pth,.nm-head>span:first-child,.ltot .ln,.sname,
.cmd-name,.fname,.ncard-top .stamp{font-family:var(--disp);text-transform:uppercase;letter-spacing:.035em}
.ph2{font-size:21px}
.ptitle{font-size:18px;font-weight:700}
.rz-next{font-size:15.5px;font-weight:700}
.thread-q{font-size:14.5px;font-weight:700}
.sname{font-size:16px}
.ltot .ln{font-size:40px}
.label{font-family:var(--mono);font-size:9px;font-weight:500;letter-spacing:.18em;
  text-transform:uppercase;color:var(--ink3)}
.hint{font-family:var(--mono);font-size:9.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink3)}

/* ---- top plate (black) ---- */
.topbar{display:contents}
.plate{color:var(--plate-ink);padding:calc(18px + env(safe-area-inset-top)) 16px 16px;
  display:flex;gap:16px;align-items:center;max-width:430px;margin:0 auto;
  border-bottom:1px dotted #3A3A34}
.plate .brand{height:66px;width:auto;display:block;max-width:62vw}

.pl-stats{font-family:var(--mono);font-size:8.5px;letter-spacing:.14em;color:#D9D5C9;text-align:left;
  line-height:2.15;padding:2px 0 2px 14px;border-left:1px solid #4A4A40;align-self:center;
  white-space:nowrap;flex:none}
.pl-stats .savestate{display:block;margin-top:6px;padding:6px 0 0;border:none;background:none;
  border-top:1px solid #2A2A24;color:#8C8270;font-size:8px;letter-spacing:.2em}
.viewtabs{display:flex;border-bottom:1px solid var(--plate-line);padding:0 10px;max-width:430px;margin:0 auto}
.vtab{flex:1;font-family:var(--mono);font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;
  color:#8C8878;padding:10px 2px 11px;border-bottom:2px solid transparent;min-height:42px}
.vtab+.vtab{border-left:1px solid #26261F}
.vtab.on{color:#F8F5EF;border-bottom-color:#D63B32}
.vtab.on .vc{color:#FF4B3E;opacity:1}
.vtab .vc{opacity:.6;margin-left:6px;letter-spacing:.05em}
.plate .btn{border-color:#4A4A40;color:var(--plate-ink);background:transparent}
.plate .btn.primary{background:var(--plate-ink);color:#000;border-color:var(--plate-ink)}
.brand{height:26px;width:auto;display:block}
.buildtag{font-size:7.5px;letter-spacing:.2em;color:#6E6A5E;border:1px solid #3A3A34;padding:1px 5px;white-space:nowrap}
.savestate{font-family:var(--mono);letter-spacing:.14em;text-transform:uppercase;
  border:1px solid #4A4A40;padding:2px 6px;color:#9B968A}
.savestate.warn{border-color:var(--orange);color:#E8A860}

main{max-width:430px;margin:0 auto;padding:0 14px calc(80px + env(safe-area-inset-bottom));
  background-color:var(--paper);min-height:100vh;box-shadow:0 0 70px rgba(0,0,0,.7)}

/* ---- buttons (paper-colored, used inside folders and plate) ---- */
.btn{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;
  padding:7px 11px;border:1px solid var(--rule2);color:var(--ink2);background:var(--card);
  display:inline-flex;gap:7px;align-items:center;min-height:32px}
.btn:hover{border-color:var(--ink3)}
.btn[disabled]{opacity:.5;cursor:default}
.btn.primary{background:#1E1D18;color:#EDEAE0;border-color:#1E1D18}
.kbd{font-size:9px;opacity:.6}
.danger{color:var(--red);border-color:#D9B3AD}

/* ---- lede (light text on the black desk) ---- */
.lede{padding:16px 2px 6px;color:var(--ink)}
.kicker{font-family:var(--mono);font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:#6E6656}
.lede h1{font-size:clamp(22px,5.4vw,29px);font-weight:700;letter-spacing:-.02em;line-height:1.16;margin:9px 0 10px}
.sub{background:var(--paper);border:1px solid var(--rule);padding:11px 13px;color:var(--ink2);max-width:46ch}
.tools{display:flex;gap:8px;margin-top:15px;flex-wrap:wrap}


/* ---- the drawer: stacked folders with colored tabs ---- */
.folders{margin-top:6px}
details.folder{position:relative;margin-top:27px;border:1px solid var(--fb);background:var(--fg)}
details.folder>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:11px;
  padding:11px 13px;flex-wrap:wrap;min-height:44px}
summary::-webkit-details-marker{display:none}
.tab{position:absolute;top:-21px;height:22px;line-height:21px;padding:0 13px;background:var(--tb);
  color:#FFFDF7;font-family:var(--mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;
  border:1px solid var(--tb)}
.fname{font-size:15.5px;font-weight:700;letter-spacing:-.01em}
.fnote{font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink3)}
.count{font-family:var(--mono);font-size:10px;color:var(--ink2);border:1px solid var(--fb);
  background:var(--card);padding:1px 7px}
.dots{display:inline-flex;gap:4px}
.dot{width:8px;height:8px;background:var(--tb);display:block}
.dot.pale{background:var(--card);border:1px solid var(--tb)}
.ticks{display:inline-flex;gap:2px}
.ticks i{width:5px;height:9px;display:block;background:var(--tb)}
.ticks i.off{background:none;border:1px solid var(--tb);opacity:.4}
.momlabel{font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--tb)}

/* ---- slips inside a folder ---- */
.stack{padding:0 13px 13px}
details.fileslip{background:var(--paper);border:1px solid var(--rule);margin-top:8px}
details.fileslip>summary{list-style:none;cursor:pointer;display:grid;
  grid-template-columns:auto minmax(0,1fr) auto;gap:11px;align-items:center;padding:11px 12px;min-height:44px}
.sname{font-size:14.5px;font-weight:600;display:block}
.sthread{font-family:var(--mono);font-size:10px;color:var(--ink3);display:block;margin-top:3px;
  line-height:1.45;overflow:hidden;display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical}
details.fileslip[open] .sthread{-webkit-line-clamp:3}
details.fileslip[open]>summary{border-bottom:1px solid var(--rule)}
.stamp,.chip{display:inline-flex;align-items:center;font-family:var(--mono);font-size:9px;
  letter-spacing:.14em;text-transform:uppercase;border:1px solid;background:var(--card);
  padding:2px 7px;white-space:nowrap}
.age{display:inline-flex;gap:6px;font-family:var(--mono);font-size:9.5px;letter-spacing:.08em;
  text-transform:uppercase;color:var(--ink3);white-space:nowrap}

/* ---- the paper sheet inside a slip ---- */
.paper{padding:15px 13px 17px}
.rz{display:flex;flex-direction:column;gap:15px}
.rz-block h4{font-family:var(--mono);font-size:9px;font-weight:500;letter-spacing:.18em;
  text-transform:uppercase;color:var(--ink3);margin:0 0 7px}
.rz-list{display:flex;flex-direction:column;gap:6px}
.rz-item{display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px;font-size:14px;color:var(--ink2)}
.rz-item .when{font-family:var(--mono);font-size:10px;color:var(--ink3);padding-top:3px}
.rz-block.settled{border-left:3px solid var(--green);padding-left:12px}
.rz-block.unresolved{border-left:3px solid var(--purple);padding-left:12px}
.rz-block.blockedb{border-left:3px solid var(--orange);padding-left:12px}
.rz-block.next{border-left:3px solid var(--red);padding-left:12px}
.rz-next{font-size:16.5px;font-weight:700;line-height:1.32}
.rz-ninety{font-size:13px;color:var(--ink3);margin-top:6px}
.recon{font-size:14px;color:var(--ink2);line-height:1.6}
.rz-meta{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin-top:10px}
.rz-err{font-family:var(--mono);font-size:9.5px;letter-spacing:.06em;text-transform:uppercase;
  color:var(--orange);margin-top:8px}
.thread-q{font-size:15.5px;font-weight:600;line-height:1.42}
.after{margin-top:16px;padding-top:13px;border-top:1px solid var(--rule)}

/* ---- spoken readout ---- */
.readout{border:1px solid var(--rule);background:#F4F1E6;padding:12px 13px;margin-bottom:15px}
.readout-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:9px}
.readout-body{font-size:14.5px;line-height:1.6;color:#332F26}
.readout-body .s{padding:1px 0}
.readout-body .s.now{background:#F6E3BE;box-shadow:0 0 0 3px #F6E3BE}
.eq{display:inline-flex;gap:2px;align-items:flex-end;height:9px}
.eq i{width:2.5px;background:currentColor;display:block;height:3px;animation:eq .78s ease-in-out infinite}
.eq i:nth-child(2){animation-delay:.16s}
.eq i:nth-child(3){animation-delay:.32s}
.speaking{border-color:var(--orange);color:var(--orange);background:#FBF0DF}
@keyframes eq{0%,100%{height:3px}50%{height:9px}}

/* ---- clipped Context / Record ---- */
details.clip{border-top:1px solid var(--rule);margin-top:12px}
details.clip>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:8px;
  padding:10px 0 8px;min-height:38px}
details.clip>summary .pm{font-family:var(--mono);font-size:11px;color:var(--ink3);width:10px}
details.clip>summary .cl{font-family:var(--mono);font-size:9px;font-weight:500;letter-spacing:.18em;
  text-transform:uppercase;color:var(--ink3)}
details.clip[open]>summary .cl{color:var(--ink2)}
.clip-body{padding:0 0 12px}
.field{padding:9px 0;border-bottom:1px solid var(--rule)}
.field:last-child{border-bottom:none}
.field .label{display:block;margin-bottom:4px}
.field p{font-size:14px;color:var(--ink2);line-height:1.55}
.field p.strong{color:var(--ink)}

/* ---- move-to + momentum stamps ---- */
.moveto{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:11px;padding-top:11px;
  border-top:1px solid var(--rule)}
.moveto.second{border-top:none;padding-top:0;margin-top:8px}
.moveto .label{margin:0 4px 0 0}
.stampbtn{font-family:var(--mono);font-size:9px;letter-spacing:.14em;text-transform:uppercase;
  border:1px solid var(--rule2);background:var(--card);color:var(--ink3);padding:4px 8px;min-height:26px}
.stampbtn.on{border-width:2px;padding:3px 7px;color:var(--ink);font-weight:500}

/* ---- workspace links (Claude / ChatGPT / anywhere) ---- */
.links{display:flex;flex-wrap:wrap;gap:8px;margin-top:7px}
.linkrow{display:flex;align-items:stretch}
.link-btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--rule2);
  background:var(--card);padding:6px 11px;font-size:13px;color:var(--ink2)}
.link-btn:hover{border-color:var(--ink3)}
.link-btn .g{font-family:var(--mono);font-size:9px;letter-spacing:.1em;color:var(--ink3)}
.linkrow .link-btn{border-right:none}
.linkx{border:1px solid var(--rule2);background:var(--card);color:var(--ink3);
  font-family:var(--mono);font-size:13px;padding:6px 12px;min-height:34px;min-width:38px}
.linkx:hover{color:var(--red);border-color:var(--red)}
.addlink{display:grid;gap:7px;margin-top:11px;border-top:1px dashed var(--rule2);padding-top:11px}
.addlink .two{display:grid;grid-template-columns:auto minmax(0,1fr);gap:7px}
.addlink input,.addlink select{font-size:16px;color:var(--ink);background:var(--card);
  border:1px solid var(--rule2);padding:8px 10px;width:100%}
.addlink input:focus,.addlink select:focus{outline:none;border-color:var(--ink3)}
.addlink .btn{justify-self:start}

/* ---- timeline ---- */
.tl{display:flex;flex-direction:column}
.tl-row{display:grid;grid-template-columns:46px 12px minmax(0,1fr);gap:9px;align-items:start;
  padding:9px 0;border-bottom:1px solid var(--rule);text-align:left;width:100%}
.tl-row:last-child{border-bottom:none}
.tl-when{font-family:var(--mono);font-size:9.5px;color:var(--ink3);padding-top:2px}
.tl-glyph{font-family:var(--mono);font-size:11px;text-align:center}
.tl-text{font-size:13.5px;color:var(--ink2);line-height:1.45}
.tl-proj{font-family:var(--mono);font-size:9px;letter-spacing:.06em;text-transform:uppercase;
  color:var(--ink3);display:block;margin-top:3px}

/* ---- orbit ---- */
.orbit-wrap{display:flex;flex-direction:column;gap:12px;align-items:center}
.orbit{width:100%;max-width:400px;height:auto;display:block}
.orbit-node{cursor:pointer}
.orbit-node line{pointer-events:none}
.orbit-node text{font-family:var(--mono);font-size:8.4px}
.ncard{background:#17171B;border:1px solid #2A2A31;border-radius:16px;color:#ECEBEF;padding:15px 14px 12px}
.ncard-top{display:flex;align-items:center;gap:10px}
.ncard-cat{font-family:var(--mono);font-size:9px;letter-spacing:.14em}
.ncard-text{font-size:15.5px;line-height:1.55;margin-top:11px;color:#ECEBEF}
.ncard-text.isdone{color:#8E8D95;text-decoration:line-through}
.ncard .stampbtn{border-radius:7px}
.ncard-foot{display:flex;gap:8px;align-items:center;margin-top:13px;padding-top:11px;border-top:1px solid #26262C}
.ncard .btn{background:#1D1D23;border-color:#2A2A31;color:#C9C8D0}
.ncard .btn.primary{background:#ECEBEF;color:#0E0E11;border-color:#ECEBEF}
.filterbar{display:flex;justify-content:space-between;align-items:center;font-family:var(--mono);
  font-size:9.5px;letter-spacing:.16em;color:#8E8D95;padding:2px 2px 0}
.filterbar button{color:#FF6B62;font-family:var(--mono);font-size:9.5px;letter-spacing:.16em;min-height:30px}
.pstrip [data-act="read"].speaking{color:#FF6B62}
.pmap{background:var(--paper);color:#111111;padding:6px 0 0;border-radius:0}
.pmast{display:flex;justify-content:space-between;font-family:var(--mono);font-size:10px;
  letter-spacing:.22em;padding-bottom:8px}
.pmast .pdim{color:#6E6656;font-size:8.5px;padding-top:2px}
.prule{height:2px;background:#111111}
.prule.thin{height:1px;margin-top:2px}
.ptitle{font-size:15.5px;font-weight:700;padding:11px 0 2px}
.ptitle em{font-style:normal;color:#D63B32}
.pgrav{display:flex;border:2px solid #111111;margin:9px 0 2px}
.pgrav button{flex:1;font-family:var(--mono);font-size:9.5px;letter-spacing:.2em;padding:8px 0;
  color:#111111;min-height:34px}
.pgrav button.on{background:#111111;color:#F8F5EF}
.pmapsvg{width:100%;height:auto;display:block}
.pcap{font-family:var(--mono);font-size:8.5px;letter-spacing:.2em;color:#6E6656;text-align:center;padding:2px 0 0}
.ohead{display:flex;justify-content:space-between;align-items:flex-start;padding:4px 0 8px}
.osub{font-family:var(--mono);font-size:8.5px;letter-spacing:.18em;color:#6E6656;line-height:1.9;margin-top:4px}
.oband{border:1px solid var(--ink);border-radius:12px;overflow:hidden;margin:10px 0 4px;background:#FFFDF7}
.ob-head{display:flex;align-items:center;gap:8px;color:#FFFDF7;font-family:var(--mono);
  font-size:9px;letter-spacing:.2em;padding:8px 12px}
.ob-x{color:#FFFDF7;font-size:15px;padding:0 4px;min-height:30px}
.oband .nrow{border-bottom:1px solid var(--rule)}
.oband .nrow:last-child{border-bottom:none}
.ob-empty{font-family:var(--mono);font-size:9px;letter-spacing:.12em;color:var(--ink3);padding:12px;text-align:center}
.olegs{border-top:1px solid var(--ink);margin-top:8px}
.oleg{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:8px 2px;
  border-bottom:1px solid var(--rule);color:var(--ink)}
.oleg i{width:10px;height:10px;border-radius:50%;flex:none}
.ol-l{flex:1;font-family:var(--mono);font-size:9.5px;letter-spacing:.14em}
.ol-l small{display:block;font-size:8px;color:var(--ink3);letter-spacing:.1em;margin-top:2px}
.oleg b{font-family:var(--disp);font-size:17px}
.ol-c{color:var(--ink3)}
.oleg.on{background:#EFEBE3}
.ocard{border:1px solid var(--ink);padding:10px 12px;margin-top:10px;display:block;width:100%;text-align:left}
.ocard label{display:block;font-family:var(--mono);font-size:7.5px;letter-spacing:.26em;color:var(--ink3);margin-bottom:4px}
.ocard b{font-size:14px;line-height:1.4;color:var(--ink)}
.ocard.red{border-color:#D63B32;cursor:pointer}
.ocard.red label{color:#D63B32}
.pstrip{margin-top:12px}
.ppies{display:flex;gap:16px;align-items:center;padding:12px 2px 12px}
.pledger{flex:1;display:flex;flex-direction:column}
.pledrow{display:flex;align-items:center;gap:9px;font-family:var(--mono);font-size:10px;
  letter-spacing:.1em;color:#111111;padding:4px 2px;text-align:left;min-height:28px}
.pledrow b{width:10px;height:10px;display:block}
.pledrow span{margin-left:auto}
.pledrow.on{background:#111111;color:#F8F5EF;padding-left:6px}
.pstrip{background:#111111;color:#F8F5EF;margin:0;padding:12px 14px;display:flex;
  justify-content:space-between;align-items:center;font-family:var(--mono);font-size:9.5px;letter-spacing:.16em}
.pstrip button{color:#FF6B62;font-family:var(--mono);font-size:9.5px;letter-spacing:.16em;min-height:30px}
.endwall{text-align:center;font-family:var(--mono);font-size:8.5px;letter-spacing:.3em;color:var(--ink3);padding:16px 0 4px}
.wallhead{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.wallhead>span:first-child{font-family:var(--disp);font-size:21px;font-weight:700;letter-spacing:.03em}
.wh-d{font-family:var(--mono);font-size:9.5px;letter-spacing:.18em;color:var(--ink3)}
.wh-sub{font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;color:var(--ink2);margin-top:6px}
.modal.throw{padding:14px 14px 12px;display:grid;gap:8px}
.th-head{display:flex;justify-content:space-between;align-items:center}
.th-head>span{font-family:var(--disp);font-size:20px;font-weight:700;letter-spacing:.03em}
.th-x{font-size:20px;color:var(--ink3);padding:0 6px;min-height:34px}
.th-sub{font-family:var(--mono);font-size:8.5px;letter-spacing:.24em;color:var(--ink3);margin-top:-4px}
.th-count{font-family:var(--mono);font-size:8.5px;letter-spacing:.14em;color:var(--ink3);text-align:right;margin-top:-4px}
.th-cats{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.th-cat{display:flex;align-items:center;gap:8px;border:1px solid var(--rule2);background:var(--card);
  padding:9px 10px;font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;color:var(--ink);min-height:38px;text-align:left}
.th-cat i{width:9px;height:9px;border-radius:50%;display:block}
.th-cat.on{border-color:var(--ink);background:#EFEBE3}
.th-go{background:var(--ink);color:#F8F5EF;font-family:var(--mono);font-size:11px;letter-spacing:.24em;
  padding:13px 0;width:100%;min-height:46px}
.th-go[disabled]{opacity:.35}
.th-hint{font-family:var(--mono);font-size:8.5px;letter-spacing:.16em;color:var(--ink3);text-align:center}
.pend{border:1px solid var(--ink);background:var(--card);padding:9px 10px;display:grid;gap:7px}
.pend-txt{font-weight:600;font-size:14px;line-height:1.45}
.pend-l{font-family:var(--mono);font-size:7.5px;letter-spacing:.24em;color:var(--ink3)}
.btn[disabled]{opacity:.35;pointer-events:none}
.tblock{border:1px solid var(--ink);background:var(--card)}
.tb-top{background:var(--ink);color:#F8F5EF;display:flex;justify-content:space-between;
  font-family:var(--mono);font-size:8.5px;letter-spacing:.22em;padding:7px 10px}
.tb-grid{display:flex}
.tb-cell{flex:1;padding:9px 10px 8px;border-right:1px solid var(--rule);text-align:left;color:var(--ink)}
.tb-cell:last-child{border-right:none}
.tb-cell label{display:block;font-family:var(--mono);font-size:7.5px;letter-spacing:.24em;color:var(--ink3);margin-bottom:3px}
.tb-cell b{font-family:var(--disp);text-transform:uppercase;font-size:16.5px;line-height:1;letter-spacing:.03em;font-weight:700}
.tb-cell b i{font-style:normal;font-size:10px;letter-spacing:.1em;color:var(--ink3)}
button.tb-cell b{color:#D63B32}
.tb-verdict{width:100%;display:flex;justify-content:space-between;align-items:center;gap:10px;
  border-top:1px solid var(--ink);padding:8px 10px;font-family:var(--mono);font-size:9px;
  letter-spacing:.16em;color:var(--ink2);text-align:left;min-height:34px}
.tb-verdict span{color:#D63B32;flex:none}
.nmain{margin:0 0 24px}
.nm-head{display:flex;align-items:center;gap:10px;color:var(--ink);font-family:var(--mono);
  font-size:11px;letter-spacing:.2em;text-transform:uppercase;padding:2px 2px 9px;
  padding-top:12px}
.nm-card{background:var(--paper);border:1px solid var(--rule);padding:9px 10px;display:grid;gap:8px}
.navbtn{border-color:#4A4A40 !important;color:#C9C4B4 !important;background:none !important}
.nm-card .statbar{justify-content:flex-start;margin:0}
.ngroupbox{border:1px solid var(--rule);background:var(--paper)}
.nrow{display:flex;align-items:center;gap:8px;padding:6px 9px;border-bottom:1px solid var(--rule)}
.ngroupbox .nrow:last-child,.ngroupbox .nrow:last-of-type{border-bottom:none}
.ndot{width:9px;height:9px;min-width:9px;border-radius:50%;flex:none;padding:0}
.ntext{flex:1;min-width:0;font-size:13.5px;line-height:1.45;text-align:left;cursor:text;color:var(--ink);
  overflow-wrap:anywhere}
.ncat{font-family:var(--mono);font-size:8.5px;letter-spacing:.06em;flex:none;padding:2px 0;min-height:26px}
.nx{color:var(--ink3);font-family:var(--mono);font-size:14px;flex:none;padding:2px 7px;min-height:30px}
.nx:hover{color:var(--red)}
.npick{border-bottom:1px solid var(--rule);background:#F4F1E6}
.gravrow{display:flex;gap:6px;align-items:center;justify-content:center;margin:0 0 8px;flex-wrap:wrap}
.gravrow .glabel{font-family:var(--mono);font-size:9px;letter-spacing:.18em;text-transform:uppercase;color:var(--ink3);margin-right:2px}
.gravrow.dark .glabel{color:#9B968A}
.gravrow.dark .gbtn{background:none;border-color:#4A4A40;color:#C9C4B4}
.gravrow.dark .gbtn.on{border-color:#C9C4B4}
.notegroup.g2{width:100%;background:#FBF8F2;border:1px solid var(--rule2);border-radius:12px;
  padding:13px 12px;margin:9px 0 0}
.notegroup.g2.gopen{border-radius:12px 12px 0 0;border-bottom:1px solid var(--rule)}
.gchev{color:var(--ink3);font-size:11px;transition:transform .18s}
.notegroup.g2:not(.gopen) .gchev{transform:rotate(-90deg)}
.gcap{text-align:center;font-family:var(--mono);font-size:9px;letter-spacing:.12em;color:var(--ink3);padding:16px 0 2px}
.notegroup{display:flex;align-items:center;gap:8px;margin:12px 0 4px;font-family:var(--mono);
  font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:#EDEAE0;
  width:100%;text-align:left;padding:4px 2px;min-height:36px}
.ngpm{color:#8C8878;font-size:12px;width:11px}
.ngdot{width:11px;height:11px;border-radius:50%;display:block}
.ngcount{border:1px solid #4A4A40;background:none;padding:1px 7px;font-size:10px;color:#C9C4B4}
.notelink{display:inline-block;font-family:var(--mono);font-size:10.5px;color:var(--blue);
  border:1px solid var(--rule2);background:var(--card);padding:1px 6px;margin:0 2px;white-space:nowrap}
.notelink:hover{border-color:var(--blue)}
.statbar{display:flex;flex-wrap:wrap;gap:2px 8px;justify-content:center;margin:0 0 8px}
.statdot{display:inline-flex;align-items:center;gap:6px;font-family:var(--mono);font-size:9px;
  letter-spacing:.1em;text-transform:uppercase;color:var(--ink3);padding:5px 6px;
  border:1px solid transparent;min-height:30px}
.statdot span{width:11px;height:11px;border-radius:50%;display:block}
.statbar.dark .statdot{color:#C9C4B4}
.statdot.on{border-color:currentColor}
.orbit-legend{display:flex;flex-wrap:wrap;gap:8px 13px;justify-content:center}
.orbit-legend div{display:flex;align-items:center;gap:6px;font-family:var(--mono);font-size:9px;
  letter-spacing:.1em;text-transform:uppercase;color:var(--ink3)}
.swatch{width:8px;height:8px;display:inline-block}

/* ---- empty folder ---- */
.folder-empty{background:var(--paper);border:1px dashed var(--rule2);padding:18px 14px;
  text-align:center;margin-top:8px}
.folder-empty p{font-size:13.5px;color:var(--ink2);max-width:40ch;margin:0 auto}

/* ---- overlays: capture / jump / new file ---- */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.72);z-index:60}
.modal{position:fixed;left:10px;right:10px;top:calc(56px + env(safe-area-inset-top));z-index:61;
  background:var(--paper);border:1px solid var(--rule2);max-width:430px;margin:0 auto;
  max-height:calc(100vh - 90px);overflow-y:auto}
.modal-head{background:#2C2B26;color:#EDEAE0;padding:8px 12px;display:flex;align-items:center;
  gap:9px;flex-wrap:wrap;font-family:var(--mono);font-size:10px;letter-spacing:.16em;
  text-transform:uppercase;position:sticky;top:0}
.modal-head .hint{color:#8C8878;letter-spacing:.04em}
.modal-head select{font-family:var(--mono);font-size:11px;text-transform:uppercase;
  letter-spacing:.08em;background:var(--card);color:var(--ink);border:1px solid var(--rule2);padding:4px 6px}
.ta{width:100%;background:none;border:none;resize:none;color:var(--ink);font-size:16px;
  line-height:1.5;padding:13px;min-height:84px}
.inp{width:100%;background:none;border:none;color:var(--ink);font-size:16px;padding:12px 13px;
  border-bottom:1px solid var(--rule)}
.ta:focus,.inp:focus{outline:none}
.parse{display:flex;gap:6px;flex-wrap:wrap;padding:0 13px 11px}
.pill{font-family:var(--mono);font-size:9px;letter-spacing:.1em;text-transform:uppercase;
  border:1px solid var(--rule2);color:var(--ink3);padding:4px 8px}
.pill.on{border-color:var(--orange);color:var(--orange);background:#FBF0DF}
.modal-foot{padding:10px 12px;border-top:1px solid var(--rule);display:flex;gap:8px;
  align-items:center;flex-wrap:wrap;background:#F4F1E6}
.cmd-list{max-height:52vh;overflow-y:auto;padding:4px 13px 8px}
.cmd-item{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;
  width:100%;text-align:left;padding:10px 0;border-bottom:1px solid var(--rule)}
.cmd-item:last-child{border-bottom:none}
.cmd-item.sel{background:#F4F1E6}
.cmd-name{font-size:14.5px;font-weight:600}
.cmd-thread{font-family:var(--mono);font-size:9.5px;color:var(--ink3);display:block;margin-top:2px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.empty{padding:20px 13px;color:var(--ink3);font-size:13.5px}
.nf{padding:12px 13px 4px}
.nf label{display:block;margin-bottom:11px}
.nf .label{display:block;margin-bottom:4px}
.nf input,.nf select{width:100%;font-size:16px;color:var(--ink);background:var(--card);
  border:1px solid var(--rule2);padding:9px 10px}
.nf input:focus,.nf select:focus{outline:none;border-color:var(--ink3)}
.nf .two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.toast{position:fixed;left:12px;right:12px;bottom:calc(16px + env(safe-area-inset-bottom));
  max-width:420px;margin:0 auto;background:#2C2B26;color:#EDEAE0;padding:11px 14px;
  font-size:13.5px;z-index:80;text-align:center}

/* ---- legend + drawer footer (light on black desk) ---- */
.legend{display:none}
.leg{display:flex;align-items:center;gap:6px;font-family:var(--mono);font-size:9px;
  letter-spacing:.12em;text-transform:uppercase;color:#9B968A}
.leg span{width:11px;height:11px;display:block}
.dfoot{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:20px;padding-top:14px;
  border-top:3px solid var(--ink)}
.dfoot .hint{margin-right:auto;color:#6E6656}

/* ---- phone: tabs become full-width color bars (approved layout) ---- */
@media (max-width:560px){
  main{padding-left:12px;padding-right:12px}
  .plate{padding-left:12px;padding-right:12px}
  .btn-jump{display:none}
  .folders{margin-top:0}
  details.folder{margin-top:9px}
  .tab{position:static;left:auto !important;display:block;width:100%;height:auto;line-height:1.35;
    padding:7px 12px;border:none;order:-1;flex-basis:100%;margin:-11px -13px 2px}
  details.folder>summary{padding-top:0}
  .stack{padding:0 10px 10px}
  .paper{padding:13px 11px 15px}
  .fnote{display:none}
  .nf .two{grid-template-columns:1fr}
}
/* ===== THE PAPER — one print system, end to end ===== */
.btn,.stampbtn,.modal,.ncard{border-radius:0}
.vtab{transition:color .18s,border-color .18s}
.orbit-node{transition:opacity .28s ease}
.statdot{border-radius:0;background:var(--card);border:1px solid var(--rule2);padding:5px 10px;color:var(--ink)}
.statbar.dark .statdot{color:var(--ink)}
.statdot.on{background:var(--ink);color:#F8F5EF;border-color:var(--ink)}
.statdot span{border-radius:50%}
.nm-card{--card:#FFFDF7;--ink:#111111;--rule2:#D9D5CF;--ink3:#8A867E;
  background:#FBF8F2;border:1px solid var(--rule2);border-radius:12px;padding:12px;display:grid;gap:9px}
.nfield{font-size:16px;color:var(--ink);background:#FFFFFF;border:1px solid var(--rule2);
  border-radius:9px;padding:11px 12px}
.nadd{background:var(--ink);color:#F8F5EF;border-color:var(--ink);border-radius:9px;
  font-family:var(--mono);font-size:10px;letter-spacing:.18em;padding:0 16px}
.nutil{border-radius:9px;font-family:var(--mono);font-size:9px;letter-spacing:.14em;
  padding:0 10px;color:var(--ink2);flex:none}
.nutil.primary{background:var(--ink);color:#F8F5EF}
.nm-card .statbar{justify-content:flex-start;margin:0}
.ngroupbox{background:#FFFDF7;border:1px solid var(--rule2);border-top:none;border-radius:0 0 12px 12px;overflow:hidden;margin-bottom:9px}
.nrow{--card:#FDFBF6;--ink:#111111;--rule2:#D9D5CF;--ink3:#8A867E;--blue:#3568A8;
  border-bottom:1px solid var(--rule)}
.ngroupbox .nrow:last-child{border-bottom:none}
.ntext{color:var(--ink)}
.nx{color:#8C8270}
.ndue{font-family:var(--mono);font-size:7.5px;letter-spacing:.08em;color:#C08A1C;
  border:1px solid #E3D2A8;background:#FAF3E2;border-radius:6px;padding:2px 6px;flex:none;white-space:nowrap}
.ndue.od{color:#D63B32;border-color:#EBC0BB;background:#FBEEEC}
.th-when{color:#C08A1C;letter-spacing:.14em}
.pressure{width:100%;display:flex;align-items:center;gap:10px;border:1px solid #D63B32;
  border-radius:12px;background:#FBEEEC;padding:11px 12px;margin:0 0 14px;text-align:left}
.pressure>span:first-child{font-family:var(--mono);font-size:9px;letter-spacing:.2em;color:#D63B32;flex:none}
.pressure .pr-t{font-size:12.5px;color:var(--ink);flex:1;min-width:0}
.pressure .pr-go{font-family:var(--mono);font-size:9px;letter-spacing:.18em;color:#D63B32;flex:none}
.modal.sweep{padding:15px 14px 14px}
.sw-top{display:flex;justify-content:space-between;align-items:center;font-family:var(--mono);
  font-size:9px;letter-spacing:.24em;color:var(--ink3)}
.sw-meta{font-family:var(--mono);font-size:8.5px;letter-spacing:.18em;color:var(--ink3);margin-top:9px}
.sw-text{font-size:16.5px;line-height:1.5;margin:9px 0 13px;color:var(--ink)}
.sw-grid{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.sw-grid button{border:1px solid var(--ink);background:#FFFDF7;padding:12px 10px;text-align:left;
  font-family:var(--disp);font-size:15px;letter-spacing:.04em;color:var(--ink);min-height:58px}
.sw-grid button small{display:block;font-family:var(--mono);font-size:7.5px;letter-spacing:.1em;
  color:var(--ink3);margin-top:3px;text-transform:none}
.sw-grid .sw-kill{border-color:#D63B32;color:#D63B32}
.deck{background:#FFFDF7;border:1px solid var(--ink);border-radius:12px;overflow:hidden;margin:2px 0 14px}
.deck-h{display:flex;align-items:center;justify-content:space-between;background:var(--ink);color:#F8F5EF;
  font-family:var(--mono);font-size:9px;letter-spacing:.24em;padding:9px 12px}
.deck-n{background:#D63B32;color:#fff;border-radius:6px;padding:1px 8px;font-size:10px;font-weight:700}
.deck .nrow{border-bottom:1px solid var(--rule)}
.deck-cap{font-family:var(--mono);font-size:8px;letter-spacing:.12em;color:var(--ink3);padding:8px 12px;text-align:center}
.nmore{color:var(--ink3);font-size:15px;letter-spacing:.1em;padding:0 4px;min-height:32px;flex:none}
.nbox{width:21px;height:21px;min-width:21px;border:1px solid var(--ink2);background:var(--card);
  flex:none;font-size:13px;color:var(--ink);line-height:1;padding:0}
.nbox.on{background:var(--ink);color:#F8F5EF;border-color:var(--ink)}
.npick{background:#EFEBE3;border-bottom:1px solid var(--rule)}
.stdot2{display:inline-flex;align-items:center;gap:6px;background:none !important}
.stdot2 i{width:8px;height:8px;border-radius:50%;display:block}
.stdot2.on{border-width:1.5px}
.notelink{background:#FFFDF7;border:1px solid #A89F87;border-radius:0;color:#2C6E9E}
.notegroup{color:var(--ink)}
.ngpm{color:#8C8270;font-size:12px;width:11px}
.ngcount{border:1px solid var(--rule2);background:#F6F1E7;padding:2px 9px;font-size:11px;color:#D63B32;font-weight:700;border-radius:7px}
.nm-head .count{border-color:#8C8270;color:var(--ink2);border-radius:0;background:none}
.viewtabs .vc{border-radius:0}
.filterbar{display:flex;justify-content:space-between;align-items:center;font-family:var(--mono);
  font-size:9.5px;letter-spacing:.16em;color:#6E6656;padding:2px 2px 0}
.filterbar button{color:#D63B32;font-family:var(--mono);font-size:9.5px;letter-spacing:.16em;min-height:30px}
.ncard{background:var(--paper);border:1px solid var(--ink);color:var(--ink);padding:15px 14px 12px}
.ncard-top{display:flex;align-items:center;gap:10px}
.ncard-cat{font-family:var(--mono);font-size:9px;letter-spacing:.14em}
.ncard-text{font-size:15px;line-height:1.55;margin-top:11px;color:var(--ink)}
.ncard-text.isdone{color:#8C8270;text-decoration:line-through}
.ncard-foot{display:flex;gap:8px;align-items:center;margin-top:13px;padding-top:11px;border-top:1px solid var(--ink)}
.ncard .btn{background:#FFFDF7;border-color:var(--rule2);color:var(--ink2)}
.ncard .btn.primary{background:var(--ink);color:#F8F5EF;border-color:var(--ink)}
/* FILES: front page + ticker */
.psec{padding:14px 0 4px;border-top:3px solid var(--ink);margin-top:14px}
#folders .psec:first-child{border-top:none;margin-top:0}
.pk{font-family:var(--mono);font-size:9px;letter-spacing:.3em;color:#D63B32}
.ph2{font-size:17px;line-height:1.3;margin:7px 0 8px;color:var(--ink)}
.pstd{border-left:4px solid var(--ink);padding:2px 0 2px 12px;margin:8px 0;font-size:12.5px;line-height:1.5;color:var(--ink2)}
.pstd b{font-family:var(--mono);font-size:8.5px;letter-spacing:.25em;color:#6E6656;display:block;margin-bottom:2px;font-weight:500}
.pnext{background:var(--ink);color:#F8F5EF;padding:10px 12px;font-size:13px;font-weight:700;
  margin-top:10px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.pnext button{font-family:var(--mono);font-size:9px;letter-spacing:.2em;color:#FF6B62;min-height:30px;flex:none}
.pth{font-family:var(--mono);font-size:10px;letter-spacing:.3em;margin-bottom:6px;color:var(--ink);font-weight:500}
.trow2{display:flex;align-items:baseline;gap:8px;border-top:1.5px solid var(--ink);padding:8px 2px;
  font-size:12.5px;width:100%;text-align:left;color:var(--ink)}
.trow2.on{background:#EBE4D2}
.trow2 b{width:128px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tst{font-family:var(--mono);font-size:8.5px;letter-spacing:.12em;width:80px;color:var(--ink2)}
.tmo{font-family:var(--mono);font-size:12px;width:52px}
.tago{margin-left:auto;font-family:var(--mono);font-size:8.5px;color:#8C8270}
.blkdesk{margin:14px 0 0;border:1px solid #D63B32;padding:10px 12px}
.blkdesk h4{font-family:var(--mono);font-size:9px;letter-spacing:.3em;color:#D63B32;font-weight:500}
.blkdesk p{font-size:12px;margin-top:5px;color:var(--ink2)}
.blkdesk.ok{border-color:#C9C0A6}
.blkdesk.ok h4{color:#8C8270}
.pfolds{margin-top:14px;border-top:3px solid var(--ink)}
#folders details.fileslip{margin-top:14px;border:1px solid var(--ink)}
/* ===== V11 · CAPTURE BUTTON + KEYBOARD-AWARE SHEET ================== */
:root{ --kb:0px; }
.throwbtn{
  display:flex;align-items:center;gap:10px;width:100%;
  background:var(--ink);color:#F8F5EF;border:1px solid var(--ink);border-radius:10px;
  padding:15px 14px;font-family:var(--mono);font-size:10.5px;letter-spacing:.15em;
  text-align:left;cursor:pointer;
}
.throwbtn .plus{
  font-size:17px;line-height:1;color:var(--red);font-weight:700;width:13px;
}
.throwbtn .tb-sub{
  margin-left:auto;font-size:8px;letter-spacing:.1em;color:#9A958C;
  border:0;background:none;padding:0;white-space:nowrap;flex:none;
}
.throwbtn .tb-main{white-space:nowrap}
.throwbtn:active{ background:#2A2A26 }
/* the sheet never hides its own file button behind the keyboard */
.modal.throw{
  max-height:calc(100vh - var(--kb) - 68px);
  overflow-y:auto;-webkit-overflow-scrolling:touch;
  scroll-padding-bottom:80px;
}
.th-files{color:var(--red);letter-spacing:.16em}
/* ===== V12 · the priority row IS the throw ========================== */
.th-throwlbl{font-family:var(--mono);font-size:8.5px;letter-spacing:.15em;
  color:var(--ink2);margin:12px 0 6px}
.th-throw{display:grid;gap:5px}
.throwrow{display:flex;align-items:center;gap:10px;width:100%;
  border:1px solid var(--rule2,#D9D5CF);border-radius:9px;background:#FCFAF6;
  padding:13px 12px;text-align:left;cursor:pointer;font-family:var(--mono)}
.throwrow i{width:10px;height:10px;border-radius:50%;flex:none;display:block}
.throwrow .tr-nm{font-size:10.5px;letter-spacing:.14em;color:var(--ink)}
.throwrow .tr-sb{font-size:8px;letter-spacing:.06em;color:#9A958C;text-transform:lowercase}
.throwrow .tr-go{margin-left:auto;font-size:11px;color:var(--red)}
.throwrow:active{background:#F1ECE2;border-color:var(--ink)}
.throwrow[disabled]{opacity:.4;cursor:default}
.throwrow[disabled] .tr-go{color:#C9C4BA}

/* ===== V11 · DETAILS DRAWER — date, reminder, provenance ============ */
.det-strip{display:flex;align-items:center;gap:9px;width:100%;margin-top:10px;
  border:1px solid var(--rule2,#D9D5CF);border-left:3px solid var(--blue);border-radius:9px;
  background:#F6F9FD;padding:10px 11px;text-align:left;font-family:var(--mono);cursor:pointer}
.det-strip.open{border-radius:9px 9px 0 0;margin-top:0;border-bottom:0}
.det-pm{font-size:13px;color:var(--blue);line-height:1;width:10px}
.det-nm{font-size:9px;letter-spacing:.16em;color:var(--blue)}
.det-sum{margin-left:auto;font-size:8px;letter-spacing:.11em;color:#8199B8}
.det{margin-top:10px;border:1px solid var(--rule2,#D9D5CF);border-left:3px solid var(--blue);
  border-radius:9px;background:#F6F9FD;overflow:hidden}
.det .det-strip{margin:0;border:0;border-bottom:1px solid #DCE6F2;border-radius:0;background:transparent}
.det-b{padding:2px 11px 9px}
.det-row{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid #E4EBF4}
.det-row:last-child{border-bottom:0}
.det-k{font-family:var(--mono);font-size:8.5px;letter-spacing:.13em;color:#5F7BA3;width:74px;flex:none}
.det-v{flex:1;min-width:0;font-family:var(--mono);font-size:11px;color:var(--ink);
  border:1px solid #C9D8EA;border-radius:6px;background:#fff;padding:8px 9px}
.det-v.set{border-color:var(--blue);color:var(--blue)}
.det-v.flat{border:0;background:none;padding-left:0;color:#4A688F;font-size:9.5px;letter-spacing:.06em}
.det-v:disabled{background:#EEF3F9;color:#9FAEC2}
.det-lbl{font-family:var(--mono);font-size:8.5px;letter-spacing:.13em;color:#5F7BA3;padding:8px 0 0}
.det-chips{display:flex;flex-wrap:wrap;gap:5px;padding:7px 0 3px}
.det-chip{font-family:var(--mono);font-size:9px;letter-spacing:.04em;color:#3D5A80;
  border:1px solid #C9D8EA;background:#fff;border-radius:14px;padding:6px 10px;cursor:pointer}
.det-chip.on{background:var(--blue);border-color:var(--blue);color:#fff}
.det-chip.clear{color:#9A958C;border-color:#DCD8D0}
.det-note{display:block;background:#EAF0F9;border-top:1px solid #DCE6F2;padding:9px 11px;
  font-family:var(--mono);font-size:8px;line-height:1.7;color:#4A688F}
@media (prefers-reduced-motion:reduce){*{animation:none !important;transition:none !important}}

/* ---- THE DAY ---- */
.daynav{display:flex;align-items:center;justify-content:space-between;border:1px solid var(--rule);background:var(--card);padding:4px}
.dayarrow{width:44px;min-height:40px;font-family:var(--mono);font-size:15px;color:var(--ink);background:none;border:none}
.dayarrow.off{opacity:.2}
.daydate{flex:1;text-align:center;font-family:var(--mono);font-size:10.5px;letter-spacing:.16em;color:var(--ink);line-height:1.5}
.daytag{display:block;font-family:var(--mono);font-size:8px;letter-spacing:.2em;color:var(--ink3);margin-top:2px;background:none;border:none}
.daytag.jump{color:var(--red);min-height:22px}
.dayedit{font-family:var(--mono);font-size:8.5px;letter-spacing:.2em;color:#F8F5EF;background:none;border:none;opacity:.72;min-height:28px;padding:0 2px}
.hrow{display:flex;align-items:center;border-bottom:1px solid var(--rule);background:var(--paper)}
.hrow:last-child{border-bottom:none}
.hrow.on{background:#F0F4EF}
.hrow.part{background:#FBF7EC}
.hrow.on.slip{background:#F7EEEC}
.hhit{flex:1;text-align:left;background:none;border:none;font-family:var(--sans);font-size:16px;color:var(--ink);padding:15px 12px;min-height:52px}
.hunit{display:block;font-family:var(--mono);font-size:8.5px;letter-spacing:.14em;color:var(--ink3);margin-top:2px;text-transform:uppercase}

.notegroup.g2 .ngdot{width:9px;height:9px;border-radius:50%;flex:none}

.nrow{padding:9px 0;margin-bottom:4px}
.nmeta{margin-top:3px;min-height:14px}
.nmid .ntext{font-size:15.5px;line-height:1.22}
.nbox{width:24px;height:24px;margin-left:10px}
.ngrip{width:30px}
.nm-head{padding-top:10px;padding-bottom:2px}

.nm-card .nutil.danger{color:var(--red);border-color:var(--rule)}

/* ---- parts of the day ---- */
.deck-h.nowbar{box-shadow:inset 4px 0 0 var(--red)}
.deck-r{display:flex;align-items:center;gap:10px}
.anch{font-family:var(--sans);font-size:12px;color:var(--accent-ink);opacity:.8;background:none;
  border:none;border-bottom:1px dotted currentColor;padding:0 0 1px;min-height:26px;text-transform:none;
  letter-spacing:0;max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nowlist{margin-top:11px;border-top:1px solid var(--rule)}
.nowitem{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:none;
  border-bottom:1px solid var(--rule);padding:11px 2px;min-height:46px}
.nowitem:last-child{border-bottom:none}
.nibox{width:20px;height:20px;border:1.5px solid var(--ink);flex:none}
.nitx{flex:1;font-family:var(--sans);font-size:15.5px;color:var(--ink)}
.nival{font-family:var(--mono);font-size:12px;font-weight:700;color:var(--ink2)}
.seg.wrap{flex-wrap:wrap}
.seg.wrap .segb{flex:1 1 30%;min-height:44px}

/* ---- LIFT ---- */
.vdot{width:6px;height:6px;background:var(--red);border-radius:50%;display:inline-block;
  vertical-align:middle;margin-left:4px}
.liftbox{border:2px solid var(--rule);background:var(--card);padding:15px 13px 13px}
.liftbox.due{border-color:var(--ink)}
.lk{font-family:var(--mono);font-size:8.5px;letter-spacing:.22em;color:var(--ink3)}
.lh{font-family:var(--disp);font-size:29px;font-weight:600;line-height:1.02;letter-spacing:.01em;
  text-transform:uppercase;margin-top:6px;color:var(--ink)}
.lsub{font-size:13.5px;color:var(--ink2);margin-top:5px;line-height:1.35}
.nmain .big{display:block;width:100%;background:var(--accent);color:var(--accent-ink);border:1px solid var(--accent);
  font-family:var(--disp);font-size:17px;letter-spacing:.18em;font-weight:600;padding:17px;margin-top:13px}
.nmain .big.ghost{background:none;color:var(--ink2);border-color:var(--rule);font-size:12px;
  letter-spacing:.16em;padding:13px;margin-top:7px}
.lweek{display:flex;gap:6px}
.lwd{flex:1;border:1px solid var(--rule);background:var(--card);text-align:center;padding:11px 3px}
.lwd.now{border-color:var(--ink);border-width:2px}
.lwd b{display:block;font-family:var(--mono);font-size:9px;letter-spacing:.14em;color:var(--ink3)}
.lwd i{display:block;font-size:17px;font-style:normal;margin:3px 0 2px;color:var(--rule)}
.lwd.on i{color:var(--green)}
.lwd u{display:block;font-family:var(--mono);font-size:7px;letter-spacing:.1em;color:var(--ink3);text-decoration:none}
.lprog{height:6px;background:var(--rule);margin-top:12px}
.lprog i{display:block;height:100%;background:var(--accent)}
.lpk{font-family:var(--mono);font-size:8.5px;letter-spacing:.18em;color:var(--ink3);margin:5px 0 12px;text-transform:uppercase}
.lex{border:1px solid var(--rule);background:var(--card);margin-bottom:8px}
.lexh{display:flex;align-items:center;gap:8px;padding:11px 11px 3px}
.lexn{flex:1;font-size:16.5px;font-weight:600;line-height:1.15}
.lmt{font-family:var(--mono);font-size:7px;letter-spacing:.1em;border:1px solid var(--ink3);
  color:var(--ink2);padding:2px 4px 1px;flex:none}
.lexs{font-family:var(--mono);font-size:10px;color:var(--ink3);flex:none}
.lhow{font-size:12.5px;color:var(--ink3);line-height:1.4;padding:5px 11px 10px}
.lup{margin:0 11px 10px;border:1.5px solid var(--green);background:#F1F6F1;padding:9px 10px}
.lup b{font-family:var(--disp);font-size:14px;letter-spacing:.06em;color:var(--green);
  text-transform:uppercase;display:block}
.lup span{display:block;font-size:12.5px;color:var(--ink2);margin-top:2px;line-height:1.3}
.lup button{margin-top:8px;background:var(--green);color:#fff;border:none;font-family:var(--mono);
  font-size:9px;letter-spacing:.16em;padding:10px 14px;min-height:38px}
.lexb{border-top:1px solid var(--rule);padding:11px}
.lwt{display:flex;align-items:center;gap:9px;margin-bottom:11px}
.lstep{width:40px;height:40px;border:1px solid var(--ink);font-family:var(--mono);font-size:17px;
  background:none;flex:none}
.lnow{font-family:var(--disp);font-size:27px;font-weight:600;line-height:1}
.lu{font-family:var(--mono);font-size:10px;color:var(--ink3);margin-left:3px}
.lsets{display:flex;gap:6px;flex-wrap:wrap}
.lset{width:52px;height:50px;border:1.5px solid var(--ink);background:var(--card);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px}
.lset b{font-family:var(--mono);font-size:14px;font-weight:700;color:var(--ink)}
.lset span{font-family:var(--mono);font-size:7px;color:var(--ink3);letter-spacing:.06em}
.lset.on{background:var(--accent);border-color:var(--accent)}
.lset.on b,.lset.on span{color:var(--accent-ink)}
.lfoot{font-size:12px;color:var(--ink3);line-height:1.45;margin:14px 0 0;text-align:center}

/* seven states won't fit as full-width rows once the keyboard is up */
.th-throw{grid-template-columns:1fr 1fr;gap:6px}
.throwrow{border-radius:0;padding:10px 10px;gap:8px;min-height:52px;align-items:flex-start;
  flex-direction:column;justify-content:center}
.throwrow .tr-top{display:flex;align-items:center;gap:7px;width:100%}
.throwrow .tr-nm{font-size:10px;letter-spacing:.11em}
.throwrow .tr-sb{font-size:7.5px;letter-spacing:.04em;line-height:1.25;padding-left:17px}
.throwrow .tr-go{display:none}

/* three across, one line each — the only shape that clears an iOS keyboard */
.th-throw{grid-template-columns:1fr 1fr 1fr;gap:5px}
.throwrow{flex-direction:row;align-items:center;justify-content:flex-start;
  border-radius:0;padding:0 7px;gap:6px;min-height:46px}
.throwrow i{width:8px;height:8px}
.throwrow .tr-nm{font-size:8.5px;letter-spacing:.06em;line-height:1.1}
.throwrow .tr-sb,.throwrow .tr-go{display:none}
.modal.throw .ta{min-height:56px}
.modal.throw .th-sub{display:none}

/* everything has to clear a 336px keyboard, so the sections scroll sideways
   instead of stacking into a 170px block */
.modal.throw .th-cats{display:flex;flex-wrap:nowrap;gap:5px;overflow-x:auto;
  -webkit-overflow-scrolling:touch;padding-bottom:2px;scrollbar-width:none}
.modal.throw .th-cats::-webkit-scrollbar{display:none}
.modal.throw .th-cat{flex:0 0 auto;display:flex;align-items:center;gap:5px;border-radius:0;
  border:1px solid var(--rule);background:#FCFAF6;padding:0 10px;min-height:38px;
  font-family:var(--mono);font-size:8.5px;letter-spacing:.1em;color:var(--ink2);white-space:nowrap}
.modal.throw .th-cat i{width:7px;height:7px;border-radius:50%;flex:none}
.modal.throw .th-cat.on{background:var(--ink);border-color:var(--ink);color:#F8F5EF}
.modal.throw .pend-l{margin:9px 0 5px}
/* trim the chrome that isn't load-bearing while typing */
.modal.throw .th-count{font-size:8px;margin:2px 0 0}
.modal.throw .th-throwlbl{margin:9px 0 5px}
.modal.throw .throwrow{min-height:42px}
.modal.throw .ta{min-height:48px}
.modal.throw .th-hint{margin-top:5px}

/* with 336px of keyboard there is no room for decoration */
body.kbup .modal.throw .th-count,
body.kbup .modal.throw .th-hint,
body.kbup .modal.throw .th-throwlbl{display:none}
body.kbup .modal.throw .ta{min-height:44px;height:44px;overflow-y:auto}
body.kbup .modal.throw .th-head{padding-top:9px;padding-bottom:7px}
body.kbup .modal.throw .pend-l{margin:7px 0 4px}
body.kbup .modal.throw .throwrow{min-height:40px}
body.kbup .modal.throw .th-cat{min-height:34px}

.th-cat.addcat,.nc-cbtn.addcat{color:var(--ink3);border-style:dashed}
.th-cat.addcat{font-weight:700}
/* the date strip stops being the app's one blue thing */
.modal.throw .det,
.modal.throw .det-strip{border-radius:0;background:var(--paper);border-color:var(--rule);
  border-left:3px solid var(--accent)}
.modal.throw .det .det-strip{border-left:0;border-bottom:1px solid var(--rule);background:none}
.modal.throw .det-nm{font-family:var(--mono);font-size:9px;letter-spacing:.16em;
  text-transform:uppercase;color:var(--ink)}
.modal.throw .det-pm{color:var(--accent);font-weight:700}
.modal.throw .det-sum{font-family:var(--mono);font-size:8px;letter-spacing:.12em;
  text-transform:uppercase;color:var(--ink3)}
.modal.throw .det-k{font-family:var(--mono);font-size:8px;letter-spacing:.16em;
  text-transform:uppercase;color:var(--ink3)}
.modal.throw .det-v{border-radius:0;border-color:var(--rule);background:var(--card);color:var(--ink)}
.modal.throw .det-row{border-bottom-color:var(--rule)}
.modal.throw .det-note{background:none;border-top:1px solid var(--rule);color:var(--ink3);
  font-size:8px;letter-spacing:.12em;text-transform:uppercase;line-height:1.6}
.modal.throw .det-chip{border-radius:0;font-family:var(--mono);font-size:9px;letter-spacing:.08em;
  text-transform:uppercase;border-color:var(--rule);color:var(--ink2);background:var(--card);min-height:34px}
.modal.throw .det-chip.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}

/* every section on screen at once — the row wraps instead of scrolling sideways */
.modal.throw .th-cats{flex-wrap:wrap;overflow-x:visible;gap:4px}
.modal.throw .th-cat{flex:0 0 auto;min-height:34px;padding:0 8px;font-size:8px}
body.kbup .modal.throw .th-cat{min-height:31px;padding:0 7px}
/* so the commit row can never be pushed off: it sticks to the bottom of the sheet */
.modal.throw .th-throw{position:sticky;bottom:0;z-index:2;background:var(--paper);
  padding-top:6px;box-shadow:0 -8px 10px -6px rgba(0,0,0,.12)}
.modal.throw .th-hint{position:sticky;bottom:0;background:var(--paper);z-index:2}

body.kbup .modal.throw{padding-top:10px}
body.kbup .modal.throw .ta{min-height:40px;height:40px}
body.kbup .modal.throw .det-strip{padding-top:8px;padding-bottom:8px}
body.kbup .modal.throw .th-cats{gap:3px}

/* =============================================================
   CAPTURE SHEET — one type scale, three roles, nothing else.
   display  Oswald   the sheet title
   text     Archivo  anything you read or tap
   label    Mono     small tracked caps, one size, one colour
   ============================================================= */
.modal.throw{padding:16px 14px 14px}
.modal.throw .th-head{font-family:var(--disp);font-size:23px;font-weight:600;
  letter-spacing:.02em;text-transform:uppercase;color:var(--ink);
  padding:0 0 10px;border-bottom:1px solid var(--rule);margin-bottom:2px}
.modal.throw .th-head span{font-family:inherit;font-size:inherit;letter-spacing:inherit}

/* the line you're writing is the biggest thing here */
.modal.throw .ta{font-family:var(--sans);font-size:18px;line-height:1.35;color:var(--ink);
  letter-spacing:-.004em;border:none;background:none;padding:12px 0 6px}
.modal.throw .ta::placeholder{color:var(--ink3);font-size:17px}
body.kbup .modal.throw .ta{font-size:17px}

/* every small label in the sheet, identical */
.modal.throw .pend-l,
.modal.throw .th-throwlbl,
.modal.throw .det-lbl,
.modal.throw .det-k,
.modal.throw .th-count,
.modal.throw .th-hint,
.modal.throw .det-note{font-family:var(--mono);font-size:8px;font-weight:400;
  letter-spacing:.2em;text-transform:uppercase;color:var(--ink3);line-height:1.5}
.modal.throw .th-files{color:var(--red);letter-spacing:.2em;font-size:8px}
.modal.throw .det-lbl{margin:2px 0 6px}
.modal.throw .th-hint{text-align:center;padding-top:8px}
.modal.throw .det-note{padding:9px 0 2px;border-top:1px solid var(--rule);margin-top:8px}

/* things you tap read as words, not as microtype */
.modal.throw .th-cat{font-family:var(--sans);font-size:12px;font-weight:500;
  letter-spacing:0;text-transform:none;color:var(--ink2);min-height:36px;padding:0 11px;gap:6px}
.modal.throw .th-cat i{width:8px;height:8px}
.modal.throw .th-cat.on{font-weight:600}
.modal.throw .th-cat.addcat{font-family:var(--mono);font-size:8.5px;letter-spacing:.14em}

.modal.throw .throwrow{min-height:46px;padding:0 9px;gap:7px}
.modal.throw .tr-nm{font-family:var(--sans);font-size:13px;font-weight:600;
  letter-spacing:0;text-transform:none;color:var(--ink)}
.modal.throw .throwrow i{width:9px;height:9px}
body.kbup .modal.throw .throwrow{min-height:42px}

.modal.throw .det-nm{font-family:var(--sans);font-size:14px;font-weight:600;
  letter-spacing:0;text-transform:none;color:var(--ink)}
.modal.throw .det-sum{font-family:var(--mono);font-size:8px;letter-spacing:.16em;
  text-transform:uppercase;color:var(--ink3)}
.modal.throw .det-chip{font-family:var(--sans);font-size:12.5px;font-weight:500;
  letter-spacing:0;text-transform:none;min-height:36px;padding:0 11px;color:var(--ink2)}
.modal.throw .det-chip.on{font-weight:600}
.modal.throw .det-v{font-family:var(--sans);font-size:14px;color:var(--ink)}
.modal.throw .det-v.flat{border:none;background:none;padding-left:0;color:var(--ink2)}
.modal.throw .det-k{width:70px}

.modal.throw .throwrow{padding:0 8px;gap:6px}
.modal.throw .tr-nm{font-size:12px;letter-spacing:-.01em;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis}
.modal.throw .th-cat{font-size:11.5px;padding:0 9px}

/* with the keyboard up the whole sheet has to fit in 438px, or the pinned
   state row starts sitting on top of the date strip */
body.kbup .modal.throw{padding:10px 12px 8px}
body.kbup .modal.throw .th-head{font-size:19px;padding-bottom:6px;margin-bottom:0}
body.kbup .modal.throw .ta{font-size:16.5px;min-height:34px;height:34px;padding:8px 0 4px}
body.kbup .modal.throw .pend-l{margin:6px 0 4px}
body.kbup .modal.throw .th-cat{min-height:29px;font-size:11px;padding:0 8px}
body.kbup .modal.throw .det-strip{padding:7px 10px}
body.kbup .modal.throw .det-nm{font-size:13px}
body.kbup .modal.throw .throwrow{min-height:40px}
body.kbup .modal.throw .th-throw{padding-top:4px}

/* last 23px: the hint line and the counter aren't load-bearing while typing */
body.kbup .modal.throw .th-hint{display:none}
body.kbup .modal.throw .th-throw{padding-top:2px;margin-top:2px}
body.kbup .modal.throw .th-cats{margin-bottom:2px}
body.kbup .modal.throw .ta{min-height:30px;height:30px}
body.kbup .modal.throw .th-head{font-size:18px;padding-bottom:5px}

body.kbup .modal.throw .th-head{font-size:17px;line-height:1.05;padding-bottom:4px}
body.kbup .modal.throw .th-count{display:none !important}
body.kbup .modal.throw .th-cat{min-height:28px;font-size:10.5px;padding:0 7px;gap:5px}
body.kbup .modal.throw .th-cat i{width:7px;height:7px}
body.kbup .modal.throw .det-strip{margin-top:6px}

.modal.throw .throwrow.addst{justify-content:center;border-style:dashed;color:var(--ink3);
  font-family:var(--mono);font-size:8.5px;letter-spacing:.14em}
.nc-strow{grid-column:1 / -1;display:flex;gap:5px;margin-top:5px}
.nc-strow .nc-cbtn{flex:1}

.grpby{display:flex;align-items:center;gap:6px;margin-top:7px}
.grpby-l{font-family:var(--mono);font-size:8px;letter-spacing:.18em;color:var(--ink3);flex:none}
.grpby-b{flex:1;font-family:var(--mono);font-size:8.5px;letter-spacing:.12em;color:var(--ink3);

.grpby-b.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}

.whint{font-family:var(--mono);font-size:8px;letter-spacing:.16em;text-transform:uppercase;
  color:var(--ink3);text-align:center;padding:8px 0 0}
.wrow{display:flex;align-items:center;gap:8px;padding:10px 4px 10px 8px;border-bottom:1px solid var(--rule)}
.wrow:last-child{border-bottom:none}
.wrow.big{background:#FBF6EC}
.wstar{width:34px;min-height:34px;font-size:15px;color:var(--ink3);background:none;border:none;flex:none}
.wrow.big .wstar{color:var(--red)}
.wtx{flex:1;font-family:var(--sans);font-size:15px;line-height:1.25;color:var(--ink)}
.wrow.big .wtx{font-weight:600}
.wx{width:34px;min-height:34px;color:var(--ink3);font-size:11px;background:none;border:none;flex:none}

/* seven tabs need room to breathe, not to be crushed together */
.viewtabs{padding:0 8px;gap:0}
.vtab{padding:11px 13px 12px;font-size:11.5px;letter-spacing:.1em}
.vtab+.vtab{border-left:1px solid #26261F}
.viewtabs::after{content:"";flex:0 0 8px}
.grpby{gap:5px}
.grpby-b{font-size:8px;letter-spacing:.1em;padding:0 4px}

.pcol{background:none;border:none;color:inherit;font:inherit;letter-spacing:inherit;
  display:flex;align-items:center;gap:7px;padding:0;min-height:30px;text-align:left}
.pchev{font-size:9px;opacity:.65}
.deck-h .deck-n{min-width:12px;text-align:right}
.addrow{display:flex;gap:5px;margin-top:5px}
.addrow button{flex:1;border:1px dashed var(--rule);background:var(--card);font-family:var(--mono);
  font-size:8.5px;letter-spacing:.14em;color:var(--ink2);min-height:42px}
.addrow button.x{flex:0 0 42px;color:var(--ink3);border-style:solid}
.evrow{display:flex;align-items:center;gap:9px;padding:11px 4px 11px 11px;border-bottom:1px solid var(--rule)}
.evrow:last-child{border-bottom:none}
.evrow.done .evtx{color:var(--ink3);text-decoration:line-through;text-decoration-color:var(--rule)}
.evbox{width:22px;height:22px;border:1.5px solid var(--ink);flex:none;display:flex;
  align-items:center;justify-content:center;font-size:13px;background:none}
.evrow.done .evbox{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.evtx{flex:1;font-family:var(--sans);font-size:15.5px;line-height:1.2}
.evtag{font-family:var(--mono);font-size:7px;letter-spacing:.14em;color:var(--ink3);
  border:1px solid var(--rule);padding:2px 4px 1px;flex:none}
.evx{width:32px;min-height:32px;color:var(--ink3);font-size:11px;background:none;border:none;flex:none}
.partedit{display:flex;flex-wrap:wrap;gap:5px;margin-top:16px;padding-top:12px;border-top:1px solid var(--rule)}
.partedit button{border:1px solid var(--rule);background:var(--card);font-family:var(--mono);
  font-size:8px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink3);
  min-height:34px;padding:0 10px}
.partedit button:first-child{border-style:dashed;color:var(--ink2)}

.wallname{background:none;border:none;padding:0;font:inherit;color:inherit;letter-spacing:inherit;
  text-transform:inherit;min-height:30px;border-bottom:1px dotted rgba(138,134,126,.55)}
.folder-empty .fe-lead{font-family:var(--disp);font-size:23px;font-weight:600;letter-spacing:.02em;
  color:var(--ink);text-transform:uppercase;margin-bottom:7px;max-width:none}

/* ---- THE DAY, rebuilt: segments while you work, solid when it's done ---- */
.dhead{display:flex;align-items:center;justify-content:space-between;border-bottom:2px solid var(--ink);
  padding-bottom:6px;margin-top:14px}
.dhead b{font-family:var(--disp);font-size:22px;font-weight:600;letter-spacing:.06em;text-transform:uppercase}
.dhr{display:flex;align-items:center;gap:8px}
.dhr i{font-family:var(--mono);font-size:9px;letter-spacing:.14em;font-style:normal;color:var(--ink3)}
.sortb{font-family:var(--mono);font-size:8px;letter-spacing:.14em;border:1px solid var(--rule);
  background:var(--card);color:var(--ink2);padding:0 8px;min-height:30px;text-transform:uppercase}
.sortb.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.dsec{display:flex;align-items:center;gap:8px;width:100%;background:none;border:none;
  padding:12px 2px 6px;font-family:var(--mono);font-size:9px;letter-spacing:.2em;
  text-transform:uppercase;color:var(--ink2);min-height:38px}
.dcv{font-size:8px;color:var(--ink3);width:9px}
.dnm{flex:1;text-align:left}
.dct{color:var(--ink3);font-size:8.5px}
.dadd{width:26px;text-align:center;font-size:15px;color:var(--ink3);line-height:1}
.dsec.now{color:var(--red);font-weight:700}
.dsec.now .dct{color:var(--red)}
.drow{position:relative;border:1px solid var(--rule);background:var(--card);
  padding:0 0 10px;margin-bottom:5px}
.dhit{display:flex;align-items:center;gap:9px;width:100%;text-align:left;background:none;border:none;
  padding:11px 12px 0;min-height:44px}
.dt{flex:1;font-family:var(--sans);font-size:16px;line-height:1.15;color:var(--ink)}
.dv{font-family:var(--mono);font-size:11px;color:var(--ink3);letter-spacing:.04em;flex:none}
.dtick{font-size:15px;color:var(--accent-ink);flex:none}
.done1{font-family:var(--mono);font-size:7px;letter-spacing:.14em;border:1px solid var(--rule);
  color:var(--ink3);padding:2px 4px 1px;flex:none}
.dgear{position:absolute;right:0;top:0;width:34px;min-height:42px;color:var(--ink3);font-size:13px;
  background:none;border:none}
.dminus{position:absolute;right:30px;top:0;width:30px;min-height:42px;color:var(--ink3);
  font-family:var(--mono);font-size:15px;background:none;border:none}
.segs{display:flex;gap:3px;margin:9px 12px 0}
.segs i{flex:1;height:12px;background:var(--rule);display:block}
.segs i.on{background:var(--accent)}
.drow.done{background:var(--accent);border-color:var(--accent);padding-bottom:11px}
.drow.done .dt{color:var(--accent-ink);font-weight:600}
.drow.done .dv{color:var(--accent-ink);opacity:.62}
.drow.done .dgear{color:var(--accent-ink);opacity:.6}
.drow.done .done1{border-color:currentColor;color:var(--accent-ink);opacity:.6}
.drow.slip{border-color:#E7CFCB}
.drow.slip .dt{color:var(--red)}
.drow.slip .segs i.on{background:var(--red)}
.drow.slip.done{background:var(--red);border-color:var(--red)}
.drow.slip.done .dt{color:#fff}
.drow.open{border-color:var(--ink)}
/* food picker, inline in its row */
.ftray{border-top:1px solid var(--rule);margin-top:10px;padding:10px 12px 2px}
.ftl{font-family:var(--mono);font-size:8px;letter-spacing:.2em;color:var(--ink3);margin-bottom:7px}
.fbtn{display:block;width:100%;text-align:left;background:var(--paper);border:1px solid var(--rule);
  padding:10px 11px;min-height:50px;margin-bottom:5px}
.fbtn b{display:block;font-family:var(--sans);font-size:15px;font-weight:600;color:var(--ink)}
.fbtn span{display:block;font-family:var(--sans);font-size:11.5px;color:var(--ink3);margin-top:1px}
.fback{display:block;width:100%;text-align:left;background:none;border:none;padding:8px 0 4px;
  font-family:var(--mono);font-size:8.5px;letter-spacing:.16em;color:var(--ink3);min-height:34px}
/* so far */
.sofar{margin-top:16px;border:1px solid var(--ink);background:var(--card);padding:12px 12px 13px}
.sfh{font-family:var(--disp);font-size:16px;letter-spacing:.14em;font-weight:600;text-transform:uppercase;
  display:flex;justify-content:space-between;align-items:baseline}
.sfh i{font-family:var(--mono);font-size:8px;font-style:normal;letter-spacing:.14em;color:var(--ink3)}
.srow{display:flex;align-items:center;gap:9px;margin-top:11px}
.srow b{font-family:var(--mono);font-size:12.5px;font-weight:700;width:56px;flex:none;color:var(--ink)}
.srow span{font-family:var(--mono);font-size:8px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--ink3);width:56px;flex:none}
.srow .mini{display:flex;gap:2px;flex:1}
.srow .mini i{flex:1;height:12px;background:var(--rule)}
.srow .mini i.on{background:var(--accent)}
.srow.slip .mini i.on{background:var(--red)}

/* editing a note shows the whole note */
.nedit{width:100%;box-sizing:border-box;display:block;resize:none;overflow:hidden;
  font-family:var(--sans);font-size:16px;line-height:1.25;color:var(--ink);
  background:var(--paper);border:1.5px solid var(--ink);border-radius:0;
  padding:9px 10px;min-height:44px}
.nedit:focus{outline:none;box-shadow:inset 0 0 0 1px var(--ink)}
.nrow:has(.nedit){align-items:flex-start;padding-top:10px;padding-bottom:10px}
.nrow:has(.nedit) .nbox{margin-top:2px}
.nrow:has(.nedit) .ngrip{display:none}

/* masthead rolls away, tabs stay */
.viewtabs{box-shadow:0 6px 10px -9px rgba(0,0,0,.5)}

/* the logo scrolls away like any other content; the tabs stick where it was */
.viewtabs{position:sticky;top:0;z-index:31;background:var(--plate)}

/* a sticky element can't leave its parent's box, so the wrapper steps out of
   the layout and the plate and tabs each carry their own ground */
.plate{background:var(--plate)}
.viewtabs{position:sticky;top:0;z-index:31;background:var(--plate)}

/* the date is the header now, and the arrows look like buttons */
.daynav{display:flex;align-items:stretch;gap:0;border:1.5px solid var(--ink);background:var(--card);
  padding:0;margin-top:14px}
.dayarrow{width:52px;min-height:56px;font-family:var(--disp);font-size:26px;font-weight:600;
  color:var(--ink);background:var(--paper);border:none;line-height:1;flex:none}
.daynav .dayarrow:first-child{border-right:2px solid var(--ink)}
.daynav .dayarrow:last-child{border-left:2px solid var(--ink)}
.dayarrow.off{opacity:.22}
.daydate{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;padding:8px 4px}
.daydate b{font-family:var(--disp);font-size:17px;font-weight:600;letter-spacing:.08em;color:var(--ink)}
.daytag{font-family:var(--mono);font-size:8px;letter-spacing:.22em;color:var(--ink3);
  background:none;border:none;min-height:auto;padding:0}
.daytag.jump{color:var(--red);min-height:20px}
/* the sheet subtitle carries the idea */
.modal.throw .th-sub{display:block;font-family:var(--sans);font-size:12.5px;letter-spacing:0;
  text-transform:none;color:var(--ink3);line-height:1.35;padding:6px 0 0;margin:0}
body.kbup .modal.throw .th-sub{display:none}

/* tighter rows — a yes/no row is one line, a counted row is one line plus a
   thin measure. More of the day on screen at once. */
.drow{padding:0 0 0;margin-bottom:4px}
.dhit{padding:0 12px;min-height:46px}
.dt{font-size:15.5px}
.dgear{min-height:46px;width:32px}
.dminus{min-height:46px;right:28px;width:28px}
.segs{margin:0 12px 8px;gap:2px}
.segs i{height:7px}
.drow.done{padding-bottom:0}
.drow.done .dhit{min-height:46px}
.dsec{padding:10px 2px 4px;min-height:34px}
.addbar{display:flex;gap:5px;margin-top:10px}
.addbar button{flex:1;border:1px dashed var(--rule);background:var(--card);
  font-family:var(--mono);font-size:8.5px;letter-spacing:.14em;color:var(--ink2);
  min-height:44px;text-transform:uppercase}

/* chevrons draw properly at any size */
.dayarrow svg{display:block;margin:0 auto}
/* the tick needs room; the gear and grip get their own gutter */
.dhit{padding-right:70px}
.dside{position:absolute;right:0;top:0;display:flex;align-items:center;height:46px}
.dgear{position:static;width:30px;min-height:46px}
.dminus{position:static;width:28px;min-height:46px}
.dgrip{width:30px;min-height:46px;color:var(--rule);font-size:12px;letter-spacing:-3px;
  background:none;border:none;touch-action:none;cursor:grab;flex:none}
.drow.done .dgrip{color:var(--accent-ink);opacity:.35}
.dtick{margin-left:2px}
.drow.dragging{opacity:.95;box-shadow:0 6px 0 rgba(0,0,0,.14);position:relative;z-index:40;
  border-color:var(--ink)}
.dlist{display:block}
/* number pad, in the row, no browser prompt */
.npad{border-top:1px solid var(--rule);margin-top:2px;padding:11px 12px 12px;background:var(--paper)}
.npl{font-family:var(--mono);font-size:8px;letter-spacing:.2em;color:var(--ink3);margin-bottom:8px}
.nprow{display:flex;gap:6px;align-items:stretch}
.npb{width:52px;border:1.5px solid var(--ink);background:var(--card);font-family:var(--mono);
  font-size:19px;color:var(--ink);min-height:54px;flex:none}
.npin{flex:1;min-width:0;border:1.5px solid var(--ink);background:var(--card);text-align:center;
  font-family:var(--disp);font-size:26px;font-weight:600;color:var(--ink);min-height:54px;
  -webkit-appearance:none;border-radius:0;padding:0 6px}
.npin:focus{outline:none;box-shadow:inset 0 0 0 2px var(--accent)}
.npin::-webkit-outer-spin-button,.npin::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.npq{display:flex;gap:5px;margin-top:7px}
.npq button{flex:1;border:1px solid var(--rule);background:var(--card);font-family:var(--mono);
  font-size:10px;color:var(--ink2);min-height:40px}
.npdone{display:block;width:100%;margin-top:7px;background:var(--accent);color:var(--accent-ink);
  border:none;font-family:var(--disp);font-size:14px;letter-spacing:.18em;font-weight:600;min-height:48px}

.syncbox{display:flex;align-items:center;justify-content:space-between;gap:9px;width:100%;
  margin:12px 0 10px;padding:10px 0;border-top:1px dotted #4A4A40;border-bottom:1px dotted #4A4A40}
.syncl{font-family:var(--mono);font-size:9px;letter-spacing:.16em;color:#8C8878;text-transform:uppercase}
.syncl span{display:block;color:#C9C4B4;letter-spacing:.1em;font-size:8.5px;margin-top:3px;text-transform:none}
.syncr{display:flex;gap:6px;flex:none}
</style>
</head>

<script>
"use strict";
/* =================================================================
   MIKE OS — project intelligence & context recovery.
   The template: a drawer of color-coded file folders. Folders hold
   file slips; a slip opens into its paper sheet. The sheet leads
   with the Resume, because the product is picking work back up.
   Mike OS holds the context; Claude, ChatGPT, GitHub and the rest
   hold the work — every file links back into its workspaces.
   ================================================================= */

/* ---------------- vocabulary ---------------- */
const TODAY = new Date();
const BUILD = "V9.1 \u00b7 AUG 8";
const CAP_MAX = 156;   /* capture ceiling \u2014 one line, not an essay */
/* How early a dated note should start showing up on ON DECK. There are no
   push notifications in a single HTML file, so a "reminder" here means one
   honest thing: the note walks into ON DECK this many days before it is due. */
const LEADS = [
  { v:0,  label:"On the day" },
  { v:1,  label:"1 day before" },
  { v:2,  label:"2 days before" },
  { v:3,  label:"3 days before" },
  { v:5,  label:"5 days before" },
  { v:7,  label:"1 week before" },
  { v:10, label:"10 days before" },
  { v:14, label:"2 weeks before" },
  { v:21, label:"3 weeks before" },
  { v:30, label:"1 month before" }
];
const leadLabel = (v) => (LEADS.find(l => l.v === (v||0)) || LEADS[0]).label;

/* one-tap dates \u2014 most things people schedule are one of these */
function shiftDay(n){
  const d = new Date(TODAY.getFullYear(), TODAY.getMonth(), TODAY.getDate() + n);
  return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
}
function nextWeekday(target){         /* 0 = Sunday */
  let n = (target - TODAY.getDay() + 7) % 7;
  if(n === 0) n = 7;
  return shiftDay(n);
}
const QUICK_DATES = () => [
  { label:"Today",     v:shiftDay(0)  },
  { label:"Tomorrow",  v:shiftDay(1)  },
  { label:"This weekend", v:nextWeekday(6) },
  { label:"Next week", v:shiftDay(7)  },
  { label:"In 2 weeks",v:shiftDay(14) },
  { label:"Next month",v:shiftDay(30) }
];
const prettyDate = (d) => d
  ? new Date(d+"T12:00").toLocaleDateString("en-US",{weekday:"short",month:"short",day:"numeric"}).toUpperCase()
  : "";

const STATE = {
  active:     { label:"Active",     color:"var(--green)" },
  blocked:    { label:"Blocked",    color:"var(--orange)" },
  incubating: { label:"Incubating", color:"var(--blue)" },
  parked:     { label:"Parked",     color:"var(--gray)" },
  complete:   { label:"Complete",   color:"var(--gray)" }
};
const MOMENTUM = {
  surging:  { label:"Surging",  bars:5, color:"var(--red)",    hex:"#B23A2E" },
  building: { label:"Building", bars:4, color:"var(--green)",  hex:"#2E7D46" },
  steady:   { label:"Steady",   bars:3, color:"var(--blue)",   hex:"#2C6E9E" },
  fading:   { label:"Fading",   bars:2, color:"var(--orange)", hex:"#C07019" },
  dormant:  { label:"Dormant",  bars:1, color:"var(--gray)",   hex:"#6F6F63" }
};
const KIND = {
  decision:{ glyph:"~", label:"Decision",      color:"var(--green)" },
  question:{ glyph:"?", label:"Open question", color:"var(--purple)" },
  blocker: { glyph:"!", label:"Blocker",       color:"var(--orange)" },
  move:    { glyph:">", label:"Next move",     color:"var(--red)" },
  thread:  { glyph:"@", label:"Thread moved",  color:"var(--red)" },
  signal:  { glyph:"·", label:"Signal",        color:"var(--ink2)" }
};
const FOLDER = {
  now:     { label:"NOW",     note:"shortest way back in",           color:"#B23A2E", fg:"#F1DCD8", fb:"#D6BAB3", left:0 },
  live:    { label:"LIVE",    note:"moving — nothing needed",        color:"#2E7D46", fg:"#DCE7DA", fb:"#BCCEB9", left:104 },
  blocked: { label:"BLOCKED", note:"waiting on a decision",          color:"#C07019", fg:"#F7E4C9", fb:"#DFC69C", left:208 },
  cooling: { label:"COOLING", note:"losing momentum",                color:"#2C6E9E", fg:"#DAE3EE", fb:"#B9C9D8", left:312 },
  parked:  { label:"PARKED",  note:"ignore until something changes", color:"#6F6F63", fg:"#E4E3DC", fb:"#C9C7BC", left:0 },
  brief:   { label:"BRIEF",   note:"everything read aloud in a minute", color:"#6B4E9E", fg:"#E3DCEE", fb:"#C7BEDB", left:104 },
  orbit:   { label:"ORBIT",   note:"projects — how far each has drifted", color:"#2A8079", fg:"#D8E7E5", fb:"#B8D1CE", left:208 },
  changes: { label:"CHANGES", note:"decisions, blockers, threads",   color:"#8A5A2B", fg:"#EBE0D0", fb:"#D2C3AC", left:312 }
};
const PROJECT_FOLDERS = ["now","live","blocked","cooling","parked"];

const STATE_DEFAULT = [
  { id:"priority",  label:"PRIORITY",   sub:"Top of the list",      hex:"#C4392E", w:24 },
  { id:"workon",    label:"WORK ON",    sub:"Chip away at it",      hex:"#2B6CB0", w:15 },
  { id:"doit",      label:"DO IT",      sub:"Quick, just do it",    hex:"#2E7D4F", w:13 },
  { id:"pending",   label:"PENDING",    sub:"Waiting on something", hex:"#C4571F", w:8  },
  { id:"inprocess", label:"IN PROCESS", sub:"Already started",      hex:"#B08D2E", w:11 },
  { id:"stagnant",  label:"STAGNANT",   sub:"Stuck for now",        hex:"#6F66A8", w:4  },
  { id:"idea",      label:"IDEA",       sub:"Might be something",   hex:"#6E6A63", w:2  },
  { id:"done",      label:"DONE",       sub:"Struck",               hex:"#8A867E", w:0  }
];
const STATE_PALETTE = ["#C4392E","#2B6CB0","#2E7D4F","#C4571F","#B08D2E","#6F66A8",
                       "#6E6A63","#3A6B8A","#8A4A5C","#7A4F3A","#456B4A","#5E5AA8"];
/* NOTE_STATUS / NOTE_ORDER read from S.states so the rest of the app is untouched */
const NOTE_STATUS = new Proxy({}, {
  get: (_, k) => (S.states || []).find(x => x.id === k),
  has: (_, k) => (S.states || []).some(x => x.id === k)
});
Object.defineProperty(window, "NOTE_ORDER", { get: () => (S.states || []).map(x => x.id) });
function seedStates(){
  if(!S.states || !S.states.length) S.states = STATE_DEFAULT.map(x => Object.assign({}, x));
  /* DONE is structural — the checkbox, the archive and the strike-through all
     depend on it, so it can never be renamed away or deleted */
  if(!S.states.some(x => x.id === "done"))
    S.states.push(Object.assign({}, STATE_DEFAULT[STATE_DEFAULT.length - 1]));
}
function addState(){
  const t = window.prompt("Name the state", "");
  if(t === null) return null;
  const label = String(t).trim().slice(0,14).toUpperCase();
  if(!label) return null;
  const found = S.states.find(x => x.label === label);
  if(found) return found.id;
  const sub = window.prompt("One line under it \u2014 optional", "") || "";
  const id = uid("s");
  const live = S.states.filter(x => x.id !== "done");
  S.states = live.concat(
    [{ id, label, sub:String(sub).trim().slice(0,26), hex:STATE_PALETTE[live.length % STATE_PALETTE.length], w:10 }],
    S.states.filter(x => x.id === "done"));
  stamp("states", id);
  return id;
}
function editState(id){
  if(id === "done"){ toast("DONE stays as it is."); return; }
  const st = S.states.find(x => x.id === id); if(!st) return;
  const t = window.prompt('Rename "' + st.label + '" \u2014 or clear it to delete', st.label);
  if(t === null) return;
  const label = String(t).trim().slice(0,14).toUpperCase();
  if(label){
    st.label = label; stamp("states", st.id);
    const sub = window.prompt("One line under it \u2014 optional", st.sub || "");
    if(sub !== null) st.sub = String(sub).trim().slice(0,26);
    render(); return;
  }
  const live = S.states.filter(x => x.id !== "done");
  if(live.length <= 1){ toast("Keep at least one state."); return; }
  if(!window.confirm('Delete "' + st.label + '"? Its notes move to ' +
      live.find(x => x.id !== id).label + '.')) return;
  const fallback = live.find(x => x.id !== id).id;
  S.notes.forEach(n => { if(n.status === id) n.status = fallback; });
  bury("states", id);
  S.states = S.states.filter(x => x.id !== id);
  render();
}
const CAT_DEFAULT = {
  work:  { label:"WORK",   hex:"#3A6B8A" },
  house: { label:"HOUSE",  hex:"#8A5A2B" }, car:   { label:"CAR",   hex:"#4E6E7E" },
  family:{ label:"FAMILY", hex:"#A04E78" }, health:{ label:"HEALTH",hex:"#2F7D5A" },
  money: { label:"MONEY",  hex:"#B08D2E" }, media: { label:"MEDIA", hex:"#B65C3F" },
  ideas: { label:"IDEAS",  hex:"#5E5AA8" }, life:  { label:"LIFE",  hex:"#6F6F63" }
};
const CAT_DEFAULT_ORDER = ["work","house","car","family","health","money","media","ideas","life"];
const CAT_PALETTE = ["#3A6B8A","#8A5A2B","#4E6E7E","#A04E78","#2F7D5A","#B08D2E",
                     "#B65C3F","#5E5AA8","#6F6F63","#7A4F3A","#456B4A","#8A4A5C"];
/* CAT and CAT_ORDER are proxies onto S.cats so the rest of the app is untouched */
const CAT = new Proxy({}, {
  get: (_, k) => (S.cats || []).find(c => c.id === k),
  has: (_, k) => (S.cats || []).some(c => c.id === k)
});
Object.defineProperty(window, "CAT_ORDER", { get: () => (S.cats || []).map(c => c.id) });
function seedCats(){
  if(!S.cats || !S.cats.length)
    S.cats = CAT_DEFAULT_ORDER.map(id => ({ id, label:CAT_DEFAULT[id].label, hex:CAT_DEFAULT[id].hex }));
}
function addCat(){
  const t = window.prompt("Name the section", "");
  if(t === null) return null;
  const label = String(t).trim().slice(0,12).toUpperCase();
  if(!label) return null;
  const found = S.cats.find(c => c.label === label);
  if(found) return found.id;
  const id = uid("c");
  S.cats.push({ id, label, hex:CAT_PALETTE[S.cats.length % CAT_PALETTE.length] });
  stamp("cats", id);
  return id;
}
function editCat(id){
  const c = S.cats.find(x => x.id === id); if(!c) return;
  const t = window.prompt('Rename "' + c.label + '" \u2014 or clear it to delete', c.label);
  if(t === null) return;
  const label = String(t).trim().slice(0,12).toUpperCase();
  if(label){ c.label = label; stamp("cats", c.id); render(); return; }
  if(S.cats.length <= 1){ toast("Keep at least one section."); return; }
  if(!window.confirm('Delete "' + c.label + '"? Its notes move to the first section.')) return;
  const fallback = S.cats.find(x => x.id !== id).id;
  S.notes.forEach(n => { if(n.cat === id) n.cat = fallback; });
  bury("cats", id);
  S.cats = S.cats.filter(x => x.id !== id);
  render();
}

/* calendar days, not elapsed hours \u2014 measuring from 09:00 made every age

const midnight = (d) => new Date(d.getFullYear(), d.getMonth(), d.getDate()).getTime();
