  if(act==="winadd"){ commitWin(); }
  if(act==="windrop"){ dropWin(el.dataset.id); }
  if(act==="winbig"){ const w = S.wins.find(x => x.id === el.dataset.id); if(w) w.big = !w.big; render(); }
  if(act==="togglehist"){ S.clips.hist14 = !S.clips.hist14; render(); }
  if(act==="cpad"){ S.swap = null; padTap(el.dataset.k); }
  if(act==="cchip"){ logPad(el.dataset.k, +el.dataset.v); }
  if(act==="cfood"){ logFood(el.dataset.id); }
  if(act==="cfoodback"){ S.foodPick = null; render(); }
  if(act==="cdrop"){ dropEntry(el.dataset.id); }
  if(act==="cclear"){ clearToday(); }
  if(act==="cswapclose"){ S.swap = null; render(); }
  if(act==="cswapno"){ swapOff(el.dataset.id); }
  if(act==="htap"){ tapHabit(el.dataset.id); }
  if(act==="hdec"){ bumpHabit(el.dataset.id, -1); }
  if(act==="numstep"){ const el2 = $("#numIn");
    if(el2){ el2.value = Math.max(0, (Math.round(+el2.value) || 0) + (+el.dataset.d)); el2.focus(); } }
  if(act==="numset"){ const el3 = $("#numIn"); if(el3) el3.value = el.dataset.v; numCommit(el.dataset.id); }
  if(act==="numdone"){ numCommit(el.dataset.id); }
  if(act==="hopen"){ openHabit(el.dataset.id); }
  if(act==="hnew"){ S.addPart = null; openHabit(null); S.draft.part = el.dataset.part || "any"; render(); }
  if(act==="hfmode"){ readHabitForm(); S.draft.mode = el.dataset.v; render(); }
  if(act==="hfkind"){ readHabitForm(); S.draft.kind = el.dataset.v; render(); }
  if(act==="hfpart"){ readHabitForm(); S.draft.part = el.dataset.v; render(); }
  if(act==="hfsave"){ saveHabit(); }
  if(act==="hfdel"){ deleteHabit(); }
  if(act==="hfcancel"){ S.draft = null; S.dayPane = "list"; render(); }
  if(act==="chaltpl"){ S.dayPane = "tpl"; render(); }
  if(act==="tpluse"){ useTemplate(el.dataset.key); }
  if(act==="chalnew"){ S.draft = { name:"", habits:[], days:30, need:24 }; S.dayPane = "chal"; render(); }
  if(act==="chaldrop"){ chalDrop(el.dataset.id); }
  if(act==="chalrestart"){ chalRestart(el.dataset.id); }
  if(act==="cfpick"){ readChalForm(); const i = S.draft.habits.indexOf(el.dataset.id);
    if(i >= 0) S.draft.habits.splice(i,1); else S.draft.habits.push(el.dataset.id); render(); }
  if(act==="cfdays"){ readChalForm(); S.draft.days = +el.dataset.v;
    S.draft.need = Math.min(S.draft.days, Math.round(S.draft.days * 0.8)); render(); }
  if(act==="cfneed"){ readChalForm();
    S.draft.need = Math.min(S.draft.days, Math.max(1, S.draft.need + (+el.dataset.v))); render(); }
  if(act==="chaledit"){ const c = S.chals.find(x => x.id === el.dataset.id);
    if(c){ S.draft = Object.assign({}, c, { habits:c.habits.slice() }); S.dayPane = "chal"; render(); } }
  if(act==="cfsave"){ readChalForm();
    const d = S.draft;
    if(!d.habits.length){ toast("Pick at least one thing."); }
    else if(d.id){ saveChal(); }
    else if(makeChal(d.name.trim() || "Challenge", d.habits, d.days, d.need)){
      S.draft = null; S.dayPane = "list"; toast("Started. Miss a day, spend a miss."); render(); } }
  if(act==="clearfilters"){ S.noteQuery = ""; S.noteFilter = null; S.catFilter = null; S.orbitFocus = null; render(); }
  if(act==="notedue"){
    const nd = S.notes.find(x => x.id === el.dataset.id);
    if(nd){
      nd.due = el.dataset.due || null;
      if(!nd.due) nd.lead = 0;
      nd.dueScanned = true;
      touchNote(nd); render();
    } }
  if(act==="penddue"){ if(S.pendingNote){
    const ta1 = $("#thText"); if(ta1) S.pendingNote.text = ta1.value;
    const v = el.dataset.due || "";
    S.pendingNote.due = v || null;
    if(!v) S.pendingNote.lead = 0;
    render(); } }
  if(act==="pendtoggledet"){ if(S.pendingNote){
    const ta0 = $("#thText"); if(ta0) S.pendingNote.text = ta0.value;
    S.pendingNote.detOpen = !S.pendingNote.detOpen;
    render(); } }
  if(act==="pendstatus"){ if(S.pendingNote){
    const ta = $("#thText"); if(ta) S.pendingNote.text = ta.value;
    S.pendingNote.status = el.dataset.status;
    /* the priority row IS the throw \u2014 one tap, no confirm */
    if(S.pendingNote.text.trim()) fileThrow();
    else render();
  } }
  if(act==="pendcat"){ if(S.pendingNote){
    const ta = $("#thText"); if(ta) S.pendingNote.text = ta.value;
    S.pendingNote.cat = el.dataset.cat; render(); } }
  if(act==="pendfile"){ fileThrow(); }
  if(act==="gomap"){ S.view = "map"; window.scrollTo(0,0); render(); }
  if(act==="jumpindex"){
    S.view = "notes"; render();
    const f = $("#notesList"); if(f) f.scrollIntoView({ block:"start", behavior:"smooth" });
  }
  if(act==="opennotes"){ S.view = "notes"; render(); }
  if(act==="accent"){ S.accent = el.dataset.c; render();  S.mt["settings"] = Date.now(); }
  if(act==="accentwheel"){ S.wheelOpen = !S.wheelOpen; render(); }
  if(act==="syncnow"){ syncNow(); }
  if(act==="syncsetup"){ setupSync(); }
  if(act==="export"){ exportBackup(); }
  if(act==="import"){ $("#importFile").click(); }
  if(act==="reset"){ clearDrawer(); }
  if(act==="clearnotes"){ clearNotes(); }
  if(act==="donesort"){ S.doneSort = S.doneSort === "top" ? "last" : "top"; render();  S.mt["settings"] = Date.now(); }
  if(act==="wallrename"){
    const t = window.prompt("Call it what you want", S.wallName || "Your Wall");
    if(t !== null){ S.wallName = String(t).trim().slice(0,24) || "Your Wall"; S.mt["settings"] = Date.now(); render(); } }
  if(act==="groupby"){ S.groupBy = ["section","all"].includes(el.dataset.v) ? el.dataset.v : "state"; render();  S.mt["settings"] = Date.now(); }
  if(act==="copyread"){
    const text = linesFor(el.dataset.scope).join(" ");
    if(navigator.clipboard) navigator.clipboard.writeText(text).then(
      ()=>toast("Status copied."), ()=>toast("Couldn't reach the clipboard."));
    else toast("Clipboard unavailable in this browser.");
  }
});

document.addEventListener("keydown", e => {
  const t = e.target;
  const typing = t && (t.tagName==="INPUT" || t.tagName==="TEXTAREA" || t.tagName==="SELECT" || t.isContentEditable);
  if((e.metaKey||e.ctrlKey) && e.key.toLowerCase()==="k"){ e.preventDefault(); S.modal = "cmd"; render(); return; }
  if(typing){
    if(e.key==="Enter" && t.dataset && t.dataset.role==="noteinput"){ e.preventDefault(); addNoteFromInput(t.value); }
    if(t.dataset && t.dataset.role==="noteedittext"){
      if(e.key==="Enter"){ e.preventDefault(); saveNoteText(t.dataset.id, t.value); }
      if(e.key==="Escape"){ S.noteEditText = null; render(); }
    }
    return;
  }
  const k = e.key.toLowerCase();
  if(k==="escape"){ if(SPEAK.playing) stopSpeech(); else if(S.modal) closeModal(); return; }
  if(k==="c"){ e.preventDefault(); S.modal = S.projects.length ? "capture" : "newfile"; render(); return; }
  if(k==="n"){ e.preventDefault(); S.modal = "newfile"; render(); return; }
  if(k==="l"){
    e.preventDefault();
    if(!S.projects.length){ toast("File a project first."); return; }
    const openSlip = Object.keys(S.rows).find(id => S.rows[id] && byId(id));
    S.logTarget = openSlip || ranked()[0].id;
    S.modal = "log"; render(); return;
  }
  if(k==="/"){ e.preventDefault(); S.modal = "cmd"; render(); return; }
  if(k==="r"){
    e.preventDefault();
    const openSlip = Object.keys(S.rows).find(id => S.rows[id] && byId(id));
    speakScope(openSlip || "brief");
    return;
  }
  if(k==="j" || k==="k"){
    e.preventDefault();
    const list = ranked();
    if(!list.length) return;
    const openId = Object.keys(S.rows).find(id => S.rows[id]);
    let i = list.findIndex(x => x.id === openId);
    if(i < 0) i = k==="j" ? -1 : list.length;
    i = k==="j" ? Math.min(i+1, list.length-1) : Math.max(i-1, 0);
    if(openId) S.rows[openId] = false;
    openProject(list[i].id);
    return;
  }
  if(/^[1-9]$/.test(k)){
    const p = ranked()[Number(k)-1];
    if(p){ e.preventDefault(); openProject(p.id); }
  }
});

document.addEventListener("focusout", e => {
  const t = e.target;
  if(t && t.dataset && t.dataset.role === "noteedittext" && S.noteEditText === t.dataset.id){
    saveNoteText(t.dataset.id, t.value);
  }
});

document.addEventListener("input", e => {
  const t = e.target;
  if(t && t.dataset && t.dataset.role === "noteedittext"){ growEdit(t); }
  if(t && t.dataset && t.dataset.role === "notesearch"){
    S.noteQuery = t.value;
    const list = $("#notesList");
    if(list) list.innerHTML = buildNoteGroups();
  }
});

$("#importFile").addEventListener("change", e => {
  const f = e.target.files && e.target.files[0];
  if(f) importBackup(f);
  e.target.value = "";
});

/* ===== V11 · KEYBOARD-AWARE SHEET ===================================
   The iOS keyboard eats ~336px. The throw sheet measures it live so the
   sheet can shrink and keep THROW IT above the keys instead of under. */
function kbHeight(){
  const vv = window.visualViewport;
  if(!vv) return 0;
  const h = Math.round(window.innerHeight - vv.height - vv.offsetTop);
  return h > 90 ? h : 0;
}
function paintKb(){
  const h = kbHeight();
  document.documentElement.style.setProperty("--kb", h + "px");
  /* the sheet trims its own chrome while the keyboard is up */
  document.body.classList.toggle("kbup", h > 80);
}
if(window.visualViewport){
  window.visualViewport.addEventListener("resize", paintKb);
  window.visualViewport.addEventListener("scroll", paintKb);
}


restore();
/* sync on open, when you come back to the tab, and every two minutes */
(function autoSync(){
  const go = () => { if(S.sync && S.sync.url && S.sync.key && navigator.onLine !== false) syncNow(true); };
  setTimeout(go, 900);
  document.addEventListener("visibilitychange", () => { if(!document.hidden) go(); });
  window.addEventListener("online", go);
  setInterval(go, 120000);
})();
scanDues();
render();
</script>
