function attentionScore(p){
  const st = { active:1, blocked:.72, incubating:.55, parked:.18, complete:0 }[p.state];
  const m = MOMENTUM[p.momentum].bars/5;
  const fresh = 1 - Math.min(1, daysSince(p.lastTouched)/60);
  return p.weight*.4 + st*.25 + m*.2 + fresh*.15;
}
const ranked = () => [...S.projects].sort((a,b) => attentionScore(b)-attentionScore(a));
function groupOf(p, spotId){
  if(p.id === spotId) return "now";
  if(p.state === "blocked") return "blocked";
  if(p.state === "parked" || p.state === "complete" || p.momentum === "dormant") return "parked";

function getResume(p){
  const base = S.resumes[p.id] || Object.assign({}, p.resume, { source:"stored" });
  const settled = (p.decisions||[]).slice(0,5).map(d => ({ date:mmdd(d.date), text:d.text }));
  const unresolved = (p.openQuestions||[]).slice(0,5);
  return Object.assign({}, base, {
    settled: settled.length ? settled : (base.settled||[]),
    unresolved: unresolved.length ? unresolved : (base.unresolved||[]),
    asOf: p.lastTouched
  });
}

const RESUME_CONTRACT = `You reconstruct working context for one person's project so they can resume it without re-reading everything.
Return ONLY valid JSON, no markdown fences, matching exactly:
{"stopped":"one sentence naming the precise point where work stopped",
 "reconstruction":"3-5 sentences rebuilding the mental state: what is settled, what the live tension is, why it stalled",
 "settled":[{"date":"MM/DD","text":"decision that must not be re-litigated"}],
 "unresolved":["open question still genuinely open"],
 "nextAction":"one concrete action, imperative, under 14 words",
 "ninety":"what to do in the first 90 focused minutes",
 "confidence":"high|medium|low"}
Be specific and unsentimental. Never invent facts not present in the input. Do not offer encouragement.`;

async function requestAiResume(p){
  const payload = { name:p.name, vision:p.vision, mission:p.mission, thread:p.thread,
    state:p.state, momentum:p.momentum, lastTouched:p.lastTouched,
    contextAgeDays:daysSince(p.lastTouched), blocker:p.blocker,
    decisions:p.decisions, openQuestions:p.openQuestions, recentSignals:p.signals };
  const res = await fetch("https://api.anthropic.com/v1/messages", {
    method:"POST", headers:{ "Content-Type":"application/json" },
    body: JSON.stringify({ model:"claude-sonnet-4-6", max_tokens:1000,
      messages:[{ role:"user", content: RESUME_CONTRACT+"\n\nPROJECT RECORD:\n"+JSON.stringify(payload,null,2) }] })
  });
  if(!res.ok) throw new Error("Model returned "+res.status);
  const data = await res.json();
  const text = (data.content||[]).filter(b=>b.type==="text").map(b=>b.text).join("\n")
    .replace(/```json|```/g,"").trim();
  return Object.assign(JSON.parse(text), { source:"reconstructed", asOf:p.lastTouched });
}

   SPOKEN READOUT — the record turned into plain sentences.

const NUM = ["zero","one","two","three","four","five","six","seven","eight","nine","ten","eleven","twelve"];
const words = (n) => NUM[n] || String(n);
const agoWords = (d) => d===0?"today":d===1?"yesterday":d<=12?words(d)+" days ago"
  :d<28?"about "+words(Math.round(d/7))+" weeks ago"
  :"about "+words(Math.max(1,Math.round(d/30)))+(Math.round(d/30)===1?" month ago":" months ago");
const stop = (s) => (/[.?!]$/.test((s||"").trim()) ? s.trim() : (s||"").trim()+".");
const strip = (s) => (s||"").trim().replace(/[.]$/,"");
const cap = (s) => s.charAt(0).toUpperCase()+s.slice(1);

function statusReadout(p){
  const r = getResume(p), d = daysSince(p.lastTouched), out = [];
  out.push(`${p.name} is ${STATE[p.state].label.toLowerCase()}, and momentum is ${p.momentum}.`);
  out.push(`You last moved it ${agoWords(d)}.`);
  out.push(`Where you stopped: ${stop(r.stopped)}`);
  const settled = (r.settled||[]).map(x => strip(x.text));
  if(settled.length) out.push(`${words(settled.length)} ${settled.length===1?"thing is":"things are"} settled and should not be reopened: ${settled.join("; ")}.`);
  const open = (r.unresolved||[]).map(strip);
  if(open.length) out.push(`Still open: ${open.join("; ")}.`);
  out.push(p.blocker ? `It is blocked. ${stop(p.blocker)}` : `Nothing is blocking it.`);
  out.push(`Best next action: ${stop(r.nextAction)}`);
  out.push(`First ninety minutes: ${stop(r.ninety)}`);
  if(d >= 21) out.push(`One caution: this context is ${agoWords(d)}, so check the detail before you trust it.`);
  return out.map(cap);
}

function dailyBrief(){
  const list = ranked(), spot = list[0];
  if(!spot) return ["The drawer is empty. Nothing to read until you file something."];
  const blocked = S.projects.filter(p => p.state==="blocked");
  const drifting = S.projects.filter(p => p.momentum==="fading" || p.momentum==="dormant");
  const idle = list.filter(p => ["parked","complete"].includes(p.state) || p.momentum==="dormant");
  const out = [];
  out.push(`${TODAY.toLocaleDateString("en-US",{weekday:"long",month:"long",day:"numeric"})}. You are tracking ${words(S.projects.length)} ${S.projects.length===1?"project":"projects"}.`);
  out.push(blocked.length
    ? `${words(blocked.length)} ${blocked.length===1?"is blocked":"are blocked"}, and ${words(drifting.length)} ${drifting.length===1?"is":"are"} losing momentum.`
    : `Nothing is blocked right now.`);
  out.push(`If you only have ninety minutes today, work on ${spot.name}.`);
  out.push(stop(getResume(spot).nextAction));
  out.push(`Where you stopped there: ${stop(getResume(spot).stopped)}`);
  list.slice(1,3).forEach(p => {
    out.push(`${p.name} is ${STATE[p.state].label.toLowerCase()} and ${p.momentum}, last touched ${agoWords(daysSince(p.lastTouched))}.`);
    out.push(p.blocker ? `Blocked on: ${stop(p.blocker)}` : `Next move: ${stop(getResume(p).nextAction)}`);
  });
  if(blocked.length) out.push(`Blocked: ${blocked.map(p=>p.name).join(", ")}. Nothing moves there until you decide.`);
  if(idle.length) out.push(`You can leave ${idle.map(p=>p.name).join(", ")} alone for now.`);
  out.push(`That is the brief.`);
  return out.map(cap);
}
function wallReadout(){
  const all = S.notes.filter(n => n.status !== "done");
  if(!all.length) return ["The wall is clear. Nothing is circling you."];
  const shares = CAT_ORDER.map(c => [c, all.filter(n => n.cat === c).length])
    .filter(x => x[1] > 0).sort((a,b) => b[1]-a[1]);
  const pri = S.notes.filter(n => n.status === "priority");
  const out = [];
  out.push(`${TODAY.toLocaleDateString("en-US",{weekday:"long",month:"long",day:"numeric"})}. ${words(all.length)} things are circling you across ${words(shares.length)} parts of your life.`);
  if(shares[0]) out.push(`${CAT[shares[0][0]].label.toLowerCase()} is the heaviest, eating ${Math.round(100*shares[0][1]/all.length)} percent of everything.`);
  out.push(pri.length ? `${words(pri.length)} ${pri.length===1?"is":"are"} pulling on you right now.` : `Nothing is pulling hard right now.`);
  pri.slice(0,4).forEach(n => out.push(`Pulling: ${stop(n.text.replace(/https?:\/\/\S+/g,"").trim())}`));
  if(pri.length > 4) out.push(`And ${words(pri.length-4)} more are pulling from the index.`);
  const stale = [...all].sort((a,b) => a.date < b.date ? -1 : 1)[0];
  if(stale && daysSince(stale.date) >= 30)
    out.push(`Oldest one here: ${stop(stale.text.replace(/https?:\/\/\S+/g,"").trim())} It has been circling ${agoWords(daysSince(stale.date)).replace("about ","")}.`);
  out.push("That is where things stand.");
  return out.map(cap);
}
const linesFor = (scope) => scope==="brief" ? dailyBrief()
  : scope==="wall" ? wallReadout()
  : (byId(scope) ? statusReadout(byId(scope)) : ["That file is gone."]);

const SPEAK = { supported: typeof window!=="undefined" && "speechSynthesis" in window,
  lines:[], idx:-1, scope:null, playing:false, voice:null };
function pickVoice(){
  if(SPEAK.voice) return SPEAK.voice;
  const vs = window.speechSynthesis.getVoices()||[];
  SPEAK.voice = vs.find(v=>/en-US/i.test(v.lang)&&v.localService) || vs.find(v=>/^en/i.test(v.lang)) || null;
  return SPEAK.voice;
}
if(SPEAK.supported && window.speechSynthesis.onvoiceschanged !== undefined){
  window.speechSynthesis.onvoiceschanged = () => { SPEAK.voice = null; pickVoice(); };
}
function stopSpeech(){
  if(SPEAK.supported) window.speechSynthesis.cancel();
  SPEAK.playing = false; SPEAK.idx = -1; SPEAK.scope = null;
  paintReadout();
}
function speakScope(scope){
  if(!SPEAK.supported) return;
  if(SPEAK.playing && SPEAK.scope === scope){ stopSpeech(); return; }
  window.speechSynthesis.cancel();
  SPEAK.lines = linesFor(scope); SPEAK.scope = scope; SPEAK.idx = 0; SPEAK.playing = true;
  paintReadout(); queueLine();
}
function queueLine(){
  if(!SPEAK.playing) return;
  if(SPEAK.idx >= SPEAK.lines.length){ stopSpeech(); return; }
  const u = new SpeechSynthesisUtterance(SPEAK.lines[SPEAK.idx]);
  u.rate = .97; const v = pickVoice(); if(v) u.voice = v;
  u.onend = () => { if(!SPEAK.playing) return; SPEAK.idx++; paintReadout(); queueLine(); };
  u.onerror = () => stopSpeech();
  window.speechSynthesis.speak(u);
}
function paintReadout(){
  document.querySelectorAll("[data-readout]").forEach(panel => {
    const on = SPEAK.playing && SPEAK.scope === panel.dataset.readout;
    panel.querySelectorAll(".s").forEach((el,i) => el.classList.toggle("now", on && i===SPEAK.idx));
  });
  document.querySelectorAll('[data-act="read"]').forEach(btn => {
    const on = SPEAK.playing && SPEAK.scope === btn.dataset.scope;
    btn.classList.toggle("speaking", on);
    btn.innerHTML = on
      ? '<span class="eq" aria-hidden="true"><i></i><i></i><i></i></span>Stop'
      : esc(btn.dataset.label || "Read status");
  });
}
function readoutPanel(scope, title, label){
  const lines = linesFor(scope);
  return `<div class="readout" data-readout="${scope}">
    <div class="readout-top"><span class="label">${esc(title)}</span><span class="grow"></span>
      ${SPEAK.supported ? `<button class="btn" data-act="read" data-scope="${scope}" data-label="${esc(label)}">${esc(label)}</button>` : ""}
      <button class="btn" data-act="copyread" data-scope="${scope}">Copy</button></div>

    ${SPEAK.supported ? "" : `<p class="hint" style="margin-top:9px;text-transform:none">This browser won't speak — the digest above is the same text.</p>`}
  </div>`;
}

/* ---- personal notes: one line + a status stamp ---- */
function linkify(text){
  return esc(text).replace(/https?:\/\/[^\s<]+/g, (u) => {
    let host = u.replace(/^https?:\/\//,"").replace(/^www\./,"").split(/[\/?#]/)[0];
    return `<a class="notelink" href="${u}" target="_blank" rel="noreferrer">${host} \u2197</a>`;
  });
}

/* =================================================================
   DRAG TO REORDER — pointer events, because HTML5 drag is dead on
   touch. Rows move inside their own list only; nothing crosses a
   tier boundary by accident. Order is written once, on drop.
   ================================================================= */
let DRAG = null;
function dragStart(e){
  const grip = e.target.closest("[data-grip]");
  if(!grip) return;
  const row  = grip.closest(".nrow, .drow");
  const list = row && row.closest("[data-droplist]");
  if(!row || !list) return;
  e.preventDefault();
  DRAG = { row, list, y0:e.clientY, y:e.clientY, x:e.clientX, moved:false, edge:0 };
  row.classList.add("dragging");
  row.style.pointerEvents = "none";   /* so elementFromPoint sees what's underneath */
  document.body.classList.add("isdragging");
  /* on window, not the grip: the row is pointer-inert while dragging */
  window.addEventListener("pointermove", dragMove, { passive:false });
  window.addEventListener("pointerup", dragEnd);
  window.addEventListener("pointercancel", dragEnd);
}
function dragMove(e){
  if(!DRAG) return;
  e.preventDefault();
  DRAG.x = e.clientX; DRAG.y = e.clientY;
  if(Math.abs(e.clientY - DRAG.y0) > 3) DRAG.moved = true;
  /* near an edge, the page comes to you — a band is taller than a phone */
  const h = window.innerHeight;
  const bar = document.querySelector(".viewtabs") || document.querySelector(".topbar");
  /* the masthead is sticky and ~167px tall — anything under it is unreachable,
     so the top trigger zone has to start below it, not at the viewport edge */
  const topEdge = (bar ? bar.getBoundingClientRect().bottom : 0) + 44;
  DRAG.edge = e.clientY < topEdge ? -1 : (e.clientY > h - 96 ? 1 : 0);
  if(DRAG.edge && !DRAG.raf) DRAG.raf = requestAnimationFrame(dragScroll);
  dragPlace();
}
function dragScroll(){
  if(!DRAG){ return; }
  DRAG.raf = 0;
  if(!DRAG.edge) return;
  const before = window.scrollY;
  window.scrollBy(0, DRAG.edge * 13);
  const d = window.scrollY - before;
  if(d){ DRAG.y0 -= d; dragPlace(); }      /* keep the row under the finger */
  DRAG.raf = requestAnimationFrame(dragScroll);
}
function dragPlace(){
  if(!DRAG) return;
  DRAG.row.style.transform = `translateY(${DRAG.y - DRAG.y0}px)`;
  const under = document.elementFromPoint(DRAG.x, DRAG.y);
  const over  = under && under.closest(".nrow, .drow");
  if(!over || over === DRAG.row) return;
  if(over.closest("[data-droplist]") !== DRAG.list) return;   /* stay in your own band */
  const r = over.getBoundingClientRect();
  const before = DRAG.y < r.top + r.height / 2;
  DRAG.list.insertBefore(DRAG.row, before ? over : over.nextSibling);
  DRAG.y0 = DRAG.y;
  DRAG.row.style.transform = "translateY(0)";
}
function dragEnd(e){
  if(!DRAG) return;
  const { row, list, moved } = DRAG;
  if(DRAG.raf) cancelAnimationFrame(DRAG.raf);
  window.removeEventListener("pointermove", dragMove);
  window.removeEventListener("pointerup", dragEnd);
  window.removeEventListener("pointercancel", dragEnd);
  row.classList.remove("dragging");
  row.style.transform = "";
  row.style.pointerEvents = "";
  document.body.classList.remove("isdragging");
  DRAG = null;
  if(!moved) return;
  const key = list.dataset.droplist || "";
  if(key.startsWith("day:")){
    const ids = [...list.querySelectorAll(".drow")]
      .map(r => r.dataset.hid || (r.querySelector("[data-grip]") || {}).dataset?.grip)
      .filter(Boolean);
    if(ids.length) reorderDay(ids);
  } else {
    const ids = [...list.querySelectorAll(".nrow")].map(r => r.dataset.nid).filter(Boolean);
    if(ids.length) reorderNotes(ids);
  }
}
document.addEventListener("pointerdown", dragStart, { passive:false });

function byOrd(list){
  /* You put things where you want them. Anything you haven't moved sits
     newest-first underneath. Nothing is sorted by weight any more. */
  return [...list].sort((a,b) => {
    const ao = Number.isFinite(a.ord) ? a.ord : Infinity;
    const bo = Number.isFinite(b.ord) ? b.ord : Infinity;
    if(ao !== bo) return ao - bo;
    return (b.date || "").localeCompare(a.date || "");
  });
}
function reorderNotes(ids){
  ids.forEach((id, i) => { const n = S.notes.find(x => x.id === id); if(n) n.ord = i; });
  render();
}
function noteRow(n){
  const st = NOTE_STATUS[n.status];

  const age = daysSince(n.date);

        ${due}<span class="nm-cat" style="color:${cat.hex}">${cat.label}</span>

        ${old}</button>
    </span>
    ${S.groupBy === "all" ? "" : `<button class="ngrip" data-grip="${n.id}" title="Drag to reorder">\u2807\u2807</button>`}
  </div>`;
}

        <button class="btn nutil" data-act="noteimport">PASTE LIST</button>
        <button class="btn nutil ${S.showFilter?"primary":""}" data-act="togglefilter">FILTER</button>
        <button class="btn nutil danger" data-act="clearnotes" title="Delete every note">CLEAR ALL</button>
      </div>
      <div class="grpby">
        <button class="grpby-b ${S.groupBy==="all"?"on":""}" data-act="groupby" data-v="all">ALL</button>
        <button class="grpby-b ${S.groupBy!=="section"&&S.groupBy!=="all"?"on":""}" data-act="groupby" data-v="state">WHAT IS IT</button>
        <button class="grpby-b ${S.groupBy==="section"?"on":""}" data-act="groupby" data-v="section">LIFE SECTION</button>
      </div>
      ${S.showFilter ? `${legendBar(false, "notefilter", S.noteFilter)}${catBar(false, "notecat")}` : ""}
      ${(S.noteQuery.trim() || S.noteFilter || S.catFilter) ? `<div class="filterbar">
        <span>${S.notes.filter(noteMatches).length} OF ${S.notes.length} SHOWN</span>
        <button data-act="clearfilters">CLEAR \u00d7</button></div>` : ""}` : ""}
    </div>
    <div id="notesList">${buildNoteGroups()}</div>
    ${S.notes.length ? `<div class="endwall">\u00b7\u00b7\u00b7\u00b7\u00b7\u00b7 THAT'S EVERYTHING \u00b7\u00b7\u00b7\u00b7\u00b7\u00b7</div>` : ""}
  </section>`;

function noteMatches(n){
  if(n.status === "done") return false;
  if(S.noteFilter && n.status !== S.noteFilter) return false;
  if(S.catFilter && n.cat !== S.catFilter) return false;
  const q = S.noteQuery.trim().toLowerCase();
  return !q || n.text.toLowerCase().includes(q);
}
function buildNoteGroups(){
  if(!S.notes.length) return `<div class="folder-empty"><p class="fe-lead">Throw it at the wall.</p>
      <p>Anything, one line. Don't file it, don't rank it carefully \u2014 get it out of your head
      and sort it later. What sticks, sticks.</p></div>`;
  const hits = S.notes.filter(noteMatches);
  if(!hits.length) return `<div class="folder-empty"><p>Nothing matches that.</p></div>`;
  if(S.groupBy === "all"){
    /* one flat list, heaviest state first, your hand order inside each */
    const rank = {}; NOTE_ORDER.forEach((k,i) => rank[k] = i);
    const flat = [...hits].sort((a,b) => {
      const ra = rank[a.status] ?? 99, rb = rank[b.status] ?? 99;
      if(ra !== rb) return ra - rb;
      const ao = Number.isFinite(a.ord) ? a.ord : Infinity;
      const bo = Number.isFinite(b.ord) ? b.ord : Infinity;
      if(ao !== bo) return ao - bo;
      return (b.date || "").localeCompare(a.date || "");
    });
    if(!flat.length) return "";
    return `<div class="deck-h" style="margin-top:14px"><span>ALL NOTES</span>
        <span class="deck-n">${flat.length} \u00b7 PRIORITY FIRST</span></div>
      <div class="ngroupbox">${flat.map(noteRow).join("")}</div>`;
  }
  const bySection = S.groupBy === "section";
  const keys = bySection ? CAT_ORDER : NOTE_ORDER.filter(st => st !== "done");
  let html = "";
  keys.forEach(k => {
    const list = byOrd(hits.filter(n => (bySection ? n.cat : n.status) === k));
    if(!list.length) return;
    const c = bySection ? CAT[k] : NOTE_STATUS[k];
    if(!c) return;
    const rows = list.map(noteRow).join("");
    const openG = S.clips["ng:"+k] !== false;   /* open unless you closed it */
    html += `<button class="notegroup g2 ${openG?"gopen":""}" data-act="togglegroup" data-st="${k}">
      <span class="gchev">\u25BE</span>
      <span class="ngdot" style="background:${c.hex}"></span>
      <span class="nglabel">${c.label}</span><span class="ngcount">${list.length}</span>
      <span class="grow"></span><span class="gchev">\u25BE</span></button>
      ${openG ? `<div class="ngroupbox" data-droplist="ng:${k}">${rows}</div>` : ""}`;
  });
  return html;
}


/* ---- attention orbit ---- */
function orbitNotes(dark){
  const RING = dark ? "#33322B" : "#D9D3C2";
  const TXT = dark ? "#B8B3A4" : "#4A483E";
  const SIZE = 440, C0 = SIZE/2, gold = 2.399963;
  const notes = S.notes.filter(n => !S.catFilter || n.cat === S.catFilter);
  const BANDN = { priority:[50,86], workon:[96,126], doit:[96,126], pending:[136,166],
    inprocess:[136,166], stagnant:[174,196], idea:[196,214], done:[196,214] };
  const showLabels = notes.length <= 14;
  let rings = "";
  [62,108,150,188,214].forEach((r,i) => rings += `<circle cx="${C0}" cy="${C0}" r="${r}" fill="none"
    stroke="${RING}" stroke-width="1" ${i>2?'stroke-dasharray="2 6" opacity=".8"':""}/>`);
  let nodes = "", wedges = "";
  const put = (n, x, y) => {
    const c = NOTE_STATUS[n.status], sz = notes.length > 20 ? 9 : 12;
    const dim = S.orbitFocus && S.orbitFocus !== n.status;
    nodes += `<g class="orbit-node" data-act="notetoast" data-id="${n.id}" opacity="${dim?.13:1}">
      <circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="15" fill="transparent"/>
      <rect x="${(x-sz/2).toFixed(1)}" y="${(y-sz/2).toFixed(1)}" width="${sz}" height="${sz}" rx="3"
        fill="${c.hex}" opacity="${n.status==="done"?.4:.95}" ${dark?'filter="url(#sqglow)"':""}/>
      ${showLabels ? `<text x="${x.toFixed(1)}" y="${(y+sz+9).toFixed(1)}" text-anchor="middle" fill="${TXT}" style="font-family:var(--mono);font-size:8.4px">${esc(n.text.length>14?n.text.slice(0,13)+"\u2026":n.text)}</text>` : ""}</g>`;
  };
  if(S.gravity === "age"){
    notes.forEach((n,i) => {
      const R = 52 + Math.min(1, daysSince(n.date)/60) * 162;
      const a = -Math.PI/2 + .4 + i*gold;
      put(n, C0+Math.cos(a)*R, C0+Math.sin(a)*R);
    });
  } else if(S.gravity === "category"){
    const cats = CAT_ORDER.filter(c => notes.some(n => n.cat === c));
    let a0 = -Math.PI/2;
    cats.forEach(c => {
      const list = notes.filter(n => n.cat === c);
      const span = 2*Math.PI * list.length / notes.length;
      const mid = a0 + span/2;
      wedges += `<line x1="${C0}" y1="${C0}" x2="${(C0+Math.cos(a0)*222).toFixed(1)}" y2="${(C0+Math.sin(a0)*222).toFixed(1)}"
        stroke="${RING}" stroke-width="1" opacity=".7"/>
        <text x="${(C0+Math.cos(mid)*231).toFixed(1)}" y="${(C0+Math.sin(mid)*231).toFixed(1)}" text-anchor="middle"
        fill="${TXT}" style="font-family:var(--mono);font-size:8.6px;letter-spacing:.08em">${CAT[c].label}</text>`;
      list.forEach((n,i) => {
        const band = BANDN[n.status] || [196,214];
        const R = band[0] + ((i*7)%11)/11 * (band[1]-band[0]);
        const a = a0 + span * (i+.5)/list.length;
        put(n, C0+Math.cos(a)*R, C0+Math.sin(a)*R);
      });
      a0 += span;
    });
  } else {
    const byStatus = {};
    notes.forEach(n => (byStatus[n.status]=byStatus[n.status]||[]).push(n));
    Object.keys(byStatus).forEach(stKey => {
      const list = byStatus[stKey], band = BANDN[stKey] || [196,214];
      list.forEach((n,i) => {
        const a = -Math.PI/2 + .4 + i*gold;
        const R = list.length === 1 ? (band[0]+band[1])/2 : band[0] + (i/(list.length-1))*(band[1]-band[0]);
        put(n, C0+Math.cos(a)*R, C0+Math.sin(a)*R);
      });
    });
  }
  // the hub is a pie of where your head is, by category
  let pie = "";
  if(S.notes.length){
    const all = S.notes, PR = 37;
    const cats2 = CAT_ORDER.filter(c => all.some(n => n.cat === c));
    let pa = -Math.PI/2;
    cats2.forEach(c => {
      const cnt = all.filter(n => n.cat === c).length;
      const dimP = S.catFilter && S.catFilter !== c;
      if(cnt === all.length){
        pie += `<circle cx="${C0}" cy="${C0}" r="${PR}" fill="${CAT[c].hex}" opacity=".9"
          data-act="notecat" data-cat="${c}" style="cursor:pointer"/>`;
        return;
      }
      const span = 2*Math.PI*cnt/all.length;
      const x1 = C0+Math.cos(pa)*PR, y1 = C0+Math.sin(pa)*PR;
      const x2 = C0+Math.cos(pa+span)*PR, y2 = C0+Math.sin(pa+span)*PR;
      pie += `<path d="M${C0},${C0} L${x1.toFixed(1)},${y1.toFixed(1)} A${PR},${PR} 0 ${span>Math.PI?1:0} 1 ${x2.toFixed(1)},${y2.toFixed(1)} Z"
        fill="${CAT[c].hex}" opacity="${dimP?.22:.9}" stroke="${dark?"#0E0E11":"#FCFBF6"}" stroke-width="1.5"
        ${dark?'filter="url(#sqglow)"':""} data-act="notecat" data-cat="${c}" style="cursor:pointer"/>`;
      pa += span;
    });
  }
  return `<div class="orbit-wrap">
    ${gravityControl(dark)}
    ${legendBar(dark, "orbitfocus", S.orbitFocus)}
    ${catBar(dark, "notecat")}
    <svg class="orbit" viewBox="0 0 ${SIZE} ${SIZE}" role="img" aria-label="Notes orbit">
      ${dark ? `<defs><filter id="sqglow" x="-80%" y="-80%" width="260%" height="260%">
        <feGaussianBlur stdDeviation="3.4" result="b"/>
        <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
      </filter></defs>` : ""}
      ${rings}${wedges}${pie}
      ${nodes}</svg>
  </div>`;
}
const MONTH_RX = "jan|feb|mar|apr|may|jun|jul|aug|sep|oct|nov|dec";
const MONTH_N = { jan:0,feb:1,mar:2,apr:3,may:4,jun:5,jul:6,aug:7,sep:8,oct:9,nov:10,dec:11 };
const WDAY_N = { sun:0,mon:1,tue:2,wed:3,thu:4,fri:5,sat:6 };
function isoPlus(days){ const d = new Date(TODAY); d.setDate(d.getDate()+days); return d.toISOString().slice(0,10); }
function parseWhen(text){
  const t = (text||"").toLowerCase();
  let due = null, time = null, m;
  if(m = t.match(/(?:@|\bat )(\d{1,2}):(\d{2})\s*(am|pm)?\b/))
    time = m[1]+":"+m[2]+(m[3]?" "+m[3].toUpperCase():"");
  else if(m = t.match(/(?:@|\bat )(\d{1,2})\s*(am|pm)\b/))
    time = m[1]+" "+m[2].toUpperCase();
  if(m = t.match(/\b(\d{1,2})\/(\d{1,2})(?:\/(\d{2,4}))?\b/)){
    const yr = m[3] ? (+m[3] < 100 ? 2000 + +m[3] : +m[3]) : TODAY.getFullYear();
    const d = new Date(yr, +m[1]-1, +m[2]);
    if(!isNaN(d)) due = d.toISOString().slice(0,10);
  } else if(m = t.match(new RegExp("\\b("+MONTH_RX+")[a-z]*\\.?\\s+(\\d{1,2})\\b"))){
    due = new Date(TODAY.getFullYear(), MONTH_N[m[1]], +m[2]).toISOString().slice(0,10);
  } else if(m = t.match(new RegExp("\\b(\\d{1,2})\\s+("+MONTH_RX+")[a-z]*\\b"))){
    due = new Date(TODAY.getFullYear(), MONTH_N[m[2]], +m[1]).toISOString().slice(0,10);
  } else if(/\b(today|tonight)\b/.test(t)) due = isoPlus(0);
  else if(/\btomorrow\b/.test(t)) due = isoPlus(1);
  else if(m = t.match(/\bin (\d+) (day|week|month)s?\b/))
    due = isoPlus(+m[1] * (m[2]==="day"?1:m[2]==="week"?7:30));
  else if(m = t.match(/~(\d+)([dwm])\b/))
    due = isoPlus(+m[1] * (m[2]==="d"?1:m[2]==="w"?7:30));
  else if(/\bnext week\b/.test(t)) due = isoPlus(7);
  else if(m = t.match(/\b(?:next |this )?(sun|mon|tue|wed|thu|fri|sat)[a-z]*\b/)){
    let ahead = (WDAY_N[m[1]] - TODAY.getDay() + 7) % 7;
    if(ahead === 0) ahead = 7;
    due = isoPlus(ahead);
  }
  if(due){
    const dd = Math.round((new Date(due+"T12:00") - TODAY) / 864e5);
    if(dd < -14 || dd > 400) due = null;  // ancient or absurd = a reference, not a deadline
  }
  if(time && !due) due = isoPlus(0);
  return { due, time };
}
function touchNote(n){ if(n){ n.touched = todayStamp(); stamp("notes", n.id); } }
function staleness(n){ return daysSince(n.touched || n.date); }
function staleOnes(){
  return S.notes.filter(n => n.status === "priority" && staleness(n) >= 14)
    .sort((a,b) => staleness(b) - staleness(a));
}
function scanDues(){
  S.notes.forEach(n => {
    if(!n.touched) n.touched = n.date;
    if(n.dueScanned) return;
    const w = parseWhen(n.text);
    if(w.due && !n.due){ n.due = w.due; n.dueTime = w.time || null; }
    n.dueScanned = true;
  });
}
function daysUntil(iso){ return Math.round((midnight(new Date(iso+"T12:00")) - midnight(TODAY)) / 864e5); }
function dueLabel(n){
  if(!n.due) return "";
  const du = daysUntil(n.due);
  const base = du === 0 ? "TODAY" : du === 1 ? "TMRW"
    : du < 0 ? Math.abs(du)+"D LATE"
    : new Date(n.due+"T12:00").toLocaleDateString("en-US",{month:"short",day:"numeric"}).toUpperCase();
  return base + (n.dueTime ? " "+n.dueTime : "");
}
const PULL_BASE = new Proxy({}, { get: (_, k) => {
  const st = (S.states || []).find(x => x.id === k);
  return st ? (Number.isFinite(+st.w) ? +st.w : 10) : 2;
} });
function pullOf(n){
  const base = PULL_BASE[n.status] || 2;
  const hot = (PULL_BASE[n.status] || 0) >= 10;   /* heavy states gain with age */
  const age = hot ? 1 + Math.min(daysSince(n.date), 45)/45 * .6 : 1;
  let t = 1;
  if(n.due && n.status !== "done"){
    const du = daysUntil(n.due);
    t = du <= 0 ? 2.1 : du <= 3 ? 1.55 : du <= 7 ? 1.25 : 1;
  }
  return Math.max(1, Math.round(base * age * t));
}

function orbitPrint(){
  const SIZE = 370, C0 = 185, CY = 172, gold = 2.399963;
  const notes = S.notes.filter(n => !S.catFilter || n.cat === S.catFilter);
  const BANDP = { pulling:[34,60], radar:[70,96], drifting:[104,130],
    someday:[136,154], outer:[152,166], done:[152,166] };
  let rings = "";
  [[52,1.2,""],[92,1,""],[128,.9,""],[158,.9,'stroke-dasharray="3 5"']].forEach(r =>
    rings += `<circle cx="${C0}" cy="${CY}" r="${r[0]}" fill="none" stroke="#111111" stroke-width="${r[1]}" ${r[2]}/>`);
  // engineering ticks on the outer ring + registration marks in the corners
  for(let t = 0; t < 12; t++){
    const ta = t * Math.PI/6;
    rings += `<line x1="${(C0+Math.cos(ta)*155).toFixed(1)}" y1="${(CY+Math.sin(ta)*155).toFixed(1)}"
      x2="${(C0+Math.cos(ta)*162).toFixed(1)}" y2="${(CY+Math.sin(ta)*162).toFixed(1)}" stroke="#111111" stroke-width=".8" opacity=".5"/>`;
  }
  [[16,16],[SIZE-16,16],[16,330],[SIZE-16,330]].forEach(pt => {
    rings += `<g stroke="#111111" stroke-width=".8" opacity=".4">
      <line x1="${pt[0]-6}" y1="${pt[1]}" x2="${pt[0]+6}" y2="${pt[1]}"/>
      <line x1="${pt[0]}" y1="${pt[1]-6}" x2="${pt[0]}" y2="${pt[1]+6}"/>
      <circle cx="${pt[0]}" cy="${pt[1]}" r="3.4" fill="none"/></g>`;
  });
  let wedges = "", nodes = "", labels = "";
  const pri = notes.filter(n => n.status === "priority").length;
  let labelBudget = notes.length <= 20 ? 14 : (pri > 10 ? 6 : 10);
  const put = (n, x, y) => {
    const dotR = n.status === "priority" ? 6.5 : (n.status === "idea" || n.status === "done") ? 5 : 5.5;
    const dim = S.orbitFocus && S.orbitFocus !== n.status;
    nodes += `<g class="orbit-node" data-act="notetoast" data-id="${n.id}" opacity="${dim?.15:1}">
      <circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="14" fill="transparent"/>
      <circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${dotR}" fill="${NOTE_STATUS[n.status].hex}"
        ${n.status==="done"?'opacity=".4"':""} stroke="#F8F5EF" stroke-width="1"/></g>`;
    const wantLabel = (n.status === "priority" || notes.length <= 20) && labelBudget > 0 && !dim;
    if(wantLabel){
      labelBudget--;
      const right = x >= C0;
      const short = n.text.length > 13 ? n.text.slice(0,12)+"\u2026" : n.text;
      labels += `<text x="${(x + (right?10:-10)).toFixed(1)}" y="${(y+3).toFixed(1)}"
        text-anchor="${right?"start":"end"}" style="font-family:var(--mono);font-size:7.6px" fill="#111111">${esc(short.toLowerCase())}</text>`;
    }
  };
  if(S.gravity === "age"){
    notes.forEach((n,i) => {
      const R = 36 + Math.min(1, daysSince(n.date)/60) * 126;
      const a = -Math.PI/2 + .4 + i*gold;
      put(n, C0+Math.cos(a)*R, CY+Math.sin(a)*R);
    });
  } else if(S.gravity === "category"){
    const cats = CAT_ORDER.filter(c => notes.some(n => n.cat === c));
    let a0 = -Math.PI/2;
    cats.forEach(c => {
      const list = notes.filter(n => n.cat === c);
      const span = 2*Math.PI * list.length / notes.length;
      const mid = a0 + span/2;
      wedges += `<line x1="${C0}" y1="${CY}" x2="${(C0+Math.cos(a0)*160).toFixed(1)}" y2="${(CY+Math.sin(a0)*160).toFixed(1)}"
        stroke="#111111" stroke-width="1" opacity=".5"/>
        <text x="${(C0+Math.cos(mid)*169).toFixed(1)}" y="${(CY+Math.sin(mid)*169).toFixed(1)}" text-anchor="middle"
        style="font-family:var(--mono);font-size:7.6px;letter-spacing:.14em" fill="#6E6656">${CAT[c].label}</text>`;
      list.forEach((n,i) => {
        const band = BANDP[n.status] || [152,166];
        const R = band[0] + ((i*7)%11)/11 * (band[1]-band[0]);
        const a = a0 + span * (i+.5)/list.length;
        put(n, C0+Math.cos(a)*R, CY+Math.sin(a)*R);
      });
      a0 += span;
    });
  } else {
    const byStatus = {};
    notes.forEach(n => {
      const eff = (n.due && n.status !== "done" && daysUntil(n.due) <= 1) ? "priority" : n.status;
      (byStatus[eff]=byStatus[eff]||[]).push(n);
    });
    Object.keys(byStatus).forEach(k => {
      const list = byStatus[k], band = BANDP[k] || [152,166];
      list.forEach((n,i) => {
        const a = -Math.PI/2 + .4 + i*gold;
        const R = list.length === 1 ? (band[0]+band[1])/2 : band[0] + (i/(list.length-1))*(band[1]-band[0]);
        put(n, C0+Math.cos(a)*R, CY+Math.sin(a)*R);
      });
    });
  }
  const all = S.notes, PR = 52;
  const shares = CAT_ORDER.map(c => [c, all.filter(n => n.cat === c).length]).filter(x => x[1] > 0)
    .sort((a,b) => b[1]-a[1]);
  let pie = `<circle cx="60" cy="60" r="${PR+4}" fill="#F8F5EF" stroke="#111111" stroke-width="2"/>`;
  let pa = -Math.PI/2;
  shares.forEach(([c,cnt]) => {
    if(cnt === all.length){
      pie += `<circle cx="60" cy="60" r="${PR}" fill="${CAT[c].hex}" data-act="notecat" data-cat="${c}" style="cursor:pointer"/>`; return;
    }
    const span = 2*Math.PI*cnt/all.length;
    const x1 = 60+Math.cos(pa)*PR, y1 = 60+Math.sin(pa)*PR;
    const x2 = 60+Math.cos(pa+span)*PR, y2 = 60+Math.sin(pa+span)*PR;
    const dimP = S.catFilter && S.catFilter !== c;
    pie += `<path d="M60,60 L${x1.toFixed(1)},${y1.toFixed(1)} A${PR},${PR} 0 ${span>Math.PI?1:0} 1 ${x2.toFixed(1)},${y2.toFixed(1)} Z"
      fill="${CAT[c].hex}" opacity="${dimP?.25:1}" stroke="#F8F5EF" stroke-width="1.5"
      data-act="notecat" data-cat="${c}" style="cursor:pointer"/>`;
    pa += span;
  });
  const ledger = shares.slice(0,6).map(([c,cnt]) =>
    `<button class="pledrow ${S.catFilter===c?"on":""}" data-act="notecat" data-cat="${c}">
      <b style="background:${CAT[c].hex}"></b>${CAT[c].label}<span>${cnt}</span></button>`).join("");
  const top = shares[0];
  const verdict = S.catFilter
    ? `${CAT[S.catFilter].label} ONLY \u2014 CLEAR IT IN THE INDEX`
    : (top ? `${CAT[top[0]].label} IS EATING ${Math.round(100*top[1]/all.length)}% OF YOU` : "");
  const modes = [["status","STATUS"],["category","CATEGORY"],["age","AGE"]];
  const live = S.notes.filter(n => n.status !== "done");
  const legend = NOTE_ORDER.filter(k => k !== "done").map(k => {
    const cnt = live.filter(n => n.status === k).length;
    const st = NOTE_STATUS[k];
    return `<button class="oleg ${S.orbitFocus===k?"on":""}" data-act="orbitfocus" data-status="${k}">
      <i style="background:${st.hex}"></i>
      <span class="ol-l">${st.label}<small>${st.sub}</small></span>
      <b>${cnt}</b><span class="ol-c">\u203A</span></button>`;
  }).join("");
  const byPull = [...live].sort((a,b) => pullOf(b) - pullOf(a));
  const move = byPull.find(n => n.status === "priority") || byPull[0];
  const hardest = top ? `${CAT[top[0]].label} \u2014 ${Math.round(100*top[1]/all.length)}% OF EVERYTHING CIRCLING` : "";
  return `<div class="pmap">
    <div class="ohead">
      <div><div class="ptitle" style="padding:0">ORBIT</div>
      <div class="osub">A MAP OF YOUR HEAD.<br>${notes.length} THINGS ARE REVOLVING AROUND YOU.</div></div>
      <span class="pdim">${TODAY.toLocaleDateString("en-US",{month:"short",day:"numeric"}).toUpperCase()}</span>
    </div>
    <div class="prule"></div><div class="prule thin"></div>
    <div class="pgrav">${modes.map(([k,l]) =>
      `<button class="${S.gravity===k?"on":""}" data-act="setgravity" data-g="${k}">${l}</button>`).join("")}</div>
    <svg viewBox="0 0 ${SIZE} 344" class="pmapsvg">
      ${rings}${wedges}
      <circle cx="${C0}" cy="${CY}" r="16" fill="#D63B32"/>
      <text x="${C0}" y="${CY+3}" text-anchor="middle" style="font-family:var(--mono);font-size:7px;letter-spacing:.2em" fill="#F8F5EF">YOU</text>
      ${nodes}${labels}</svg>
    <div class="pcap">CLOSER = HEAVIER \u00b7 TAP A TIER TO OPEN ITS BAND</div>
    ${(() => {
      if(!S.orbitFocus || !NOTE_STATUS[S.orbitFocus]) return "";
      const st = NOTE_STATUS[S.orbitFocus];
      const band = live.filter(n => n.status === S.orbitFocus)
        .sort((a,b) => pullOf(b) - pullOf(a));
      return `<div class="oband">
        <div class="ob-head" style="background:${st.hex}">
          <span>\u25CF ${st.label}</span><span class="grow"></span>
          <span>${band.length} ITEM${band.length===1?"":"S"}</span>
          <button data-act="orbitfocus" data-status="${S.orbitFocus}" class="ob-x">\u00d7</button>
        </div>
        ${band.length ? band.map(noteRow).join("")
          : `<div class="ob-empty">Nothing in this band. It's either done or it never landed here.</div>`}
      </div>`;
    })()}
    <div class="olegs">${legend}</div>
    ${hardest ? `<div class="ocard"><label>WHAT'S PULLING HARDEST</label><b>${esc(hardest)}</b></div>` : ""}
    ${move ? `<div class="ocard red" data-act="notetoast" data-id="${move.id}" role="button">
      <label>ONE MOVE</label><b>${esc(move.text.replace(/https?:\/\/\S+/g,"").trim())}</b></div>` : ""}
    <div class="pstrip"><span>${esc(verdict)}</span>
      <span style="display:flex;gap:14px">
      <button data-act="read" data-scope="wall" data-label="READ \u25BA">READ \u25BA</button>
      <button data-act="jumpindex">INDEX \u2193</button></span></div>
  </div>`;
}

function orbitSVG(dark){
  const RING = dark ? "#33322B" : "#D9D3C2";
  const TXT = dark ? "#B8B3A4" : "#4A483E";
  const SIZE=440, C0=SIZE/2, RADII={1:62,2:108,3:150,4:188,5:214};

  const spot = ranked()[0];

  S.projects.forEach(p => { const r = ring(p); (byRing[r]=byRing[r]||[]).push(p); });
  let rings = "";
  [1,2,3,4,5].forEach(r => rings += `<circle cx="${C0}" cy="${C0}" r="${RADII[r]}" fill="none"

      const base = -Math.PI/2 + Number(r)*.85;
      const a = base + (i*2*Math.PI)/Math.max(list.length,2.4);
      const R = RADII[r], x = C0+Math.cos(a)*R, y = C0+Math.sin(a)*R;

        <circle cx="${x}" cy="${y}" r="${rad+6}" fill="transparent"/>
        <circle cx="${x}" cy="${y}" r="${rad}" fill="${m.hex}" opacity="${blocked?.22:.92}"/>

        <text x="${x}" y="${y+rad+13}" text-anchor="middle" fill="${TXT}">${esc(p.name)}</text></g>`;
    });
  });
  const legend = dark ? "" : Object.keys(MOMENTUM).map(k =>
    `<div><span class="swatch" style="background:${MOMENTUM[k].hex}"></span>${MOMENTUM[k].label}</div>`).join("");
  return `<div class="orbit-wrap">

      ${nodes}</svg>
    ${dark ? "" : `<div class="orbit-legend">${legend}
      <div><span class="swatch" style="border:1.6px solid #C07019;background:none"></span>Blocked</div></div>`}
  </div>`;
}

/* =================================================================

   S.day       { "2026-08-25": { habitId: n } }        n>0 only
   S.chals     [{id,name,habits:[id],mode:do|avoid,days,need,start,done}]
   ================================================================= */
const DEFAULT_HABITS = [

];
const CHAL_TEMPLATES = [
  { key:"dry",    name:"Dry 30",           habits:["h_drink"],  days:30, need:30, blurb:"Thirty days, none of them wet." },
  { key:"temper", name:"Keep your temper", habits:["h_yell"],   days:30, need:27, blurb:"Three bad days allowed. That's being a person." },
  { key:"chips",  name:"No gambling",      habits:["h_gamble"], days:30, need:30, blurb:"Thirty clean days." },
  { key:"move",   name:"Move most days",   habits:["h_gym","h_workout","h_stretch"], days:30, need:24, blurb:"Any of gym, workout or stretch counts. Six misses." },
  { key:"dog",    name:"Walk the dog",     habits:["h_dog"],    days:14, need:12, blurb:"Two weeks. Two off days." },

const dayCur   = () => S.dayCursor || todayStamp();
const hval     = (iso, id) => { const r = S.day[iso]; return (r && +r[id]) || 0; };
const habitBy  = (id) => S.habits.find(h => h.id === id);
const hitBar   = (h) => Math.max(1, (h && h.mode !== "check" && h.goal) ? h.goal : 1);
const didIt    = (iso, id) => { const h = habitBy(id); return !!h && hval(iso, id) >= hitBar(h); };
function isoShift(iso, n){ const d = new Date(iso + "T12:00:00"); d.setDate(d.getDate() + n); return d.toISOString().slice(0,10); }
function seedHabits(){ if(!S.habits.length) S.habits = DEFAULT_HABITS.map(h => Object.assign({}, h)); }
function setHab(iso, id, v){
  stamp("day", iso);
  if(v > 0){ if(!S.day[iso]) S.day[iso] = {}; S.day[iso][id] = Math.min(999999, v); }
  else if(S.day[iso]){ delete S.day[iso][id]; if(!Object.keys(S.day[iso]).length) delete S.day[iso]; }
}
function stepDayCursor(n){
  const iso = isoShift(dayCur(), n);
  if(iso > todayStamp()) return;
  S.dayCursor = (iso === todayStamp()) ? null : iso;
  render();
}
function tapHabit(id){
  const h = habitBy(id); if(!h) return;
  const iso = dayCur(), v = hval(iso, id);
  if(h.mode === "count"){ setHab(iso, id, v + 1); }
  else if(h.mode === "num"){
    S.numEdit = S.numEdit === id ? null : id;   /* opens an inline pad, not a browser prompt */
    render(); return;
  }
  else { setHab(iso, id, v ? 0 : 1); }
  render();
}
function numPad(h, v){

        placeholder="${h.goal ? h.goal.toLocaleString() : "0"}">

      .map(q => `<button data-act="numset" data-id="${h.id}" data-v="${q}">${q.toLocaleString()}</button>`).join("")}</div>
    <button class="npdone" data-act="numdone" data-id="${h.id}">DONE</button>

}

  if(el){ const n = Math.max(0, Math.round(+el.value) || 0); setHab(dayCur(), id, n); }

function bumpHabit(id, d){ const iso = dayCur(); setHab(iso, id, Math.max(0, hval(iso, id) + d)); render(); }

/* ---- challenges: X of N days, never a streak ---- */
function chalStat(c){
  /* Today never spends a miss — the day isn't over yet. Only settled
     days (strictly before today) can count against you. */
  const now = todayStamp();
  let settled = 0, hitsSettled = 0, todayIn = false, todayGood = false;
  for(let i = 0; i < c.days; i++){
    const iso = isoShift(c.start, i);
    if(iso > now) break;
    const any  = c.habits.some(id => didIt(iso, id));
    const good = c.mode === "avoid" ? !any : any;
    /* Not doing the gym yet today is provisional. Having already drunk
       today is not — a logged slip is a fact, so it settles immediately. */
    const slipped = c.mode === "avoid" && any;
    if(iso === now && !slipped){ todayIn = true; todayGood = good; }
    else { settled++; if(good) hitsSettled++; }
  }
  const hits    = hitsSettled + (todayIn && todayGood ? 1 : 0);
  const ahead   = c.days - settled - (todayIn ? 1 : 0);
  const left    = Math.max(0, c.days - settled);
  const allowed = c.days - c.need;
  const missed  = settled - hitsSettled;
  const spare   = Math.max(0, allowed - missed);
  const best    = hitsSettled + (todayIn ? 1 : 0) + ahead;
  return { hits, settled, elapsed: settled + (todayIn ? 1 : 0), left, ahead,
           toGo: Math.max(0, c.need - hits), allowed, missed, spare,
           won: hits >= c.need, gone: best < c.need };
}
function chalCard(c){
  const st = chalStat(c);
  const pct = Math.min(100, Math.round(st.hits / c.need * 100));
  let line, tone = "";
  if(st.won){ line = "Done. " + st.hits + " of " + c.need + "."; tone = " won"; }
  else if(st.gone){ line = "Won't reach " + c.need + " this round. Restart it or let it go."; tone = " gone"; }
  else if(c.mode === "avoid"){ line = st.hits + " clean \u00b7 " + st.toGo + " to go \u00b7 " + st.spare + (st.spare === 1 ? " slip left" : " slips left"); }
  else { line = st.hits + " done \u00b7 " + st.toGo + " to go \u00b7 " + st.spare + (st.spare === 1 ? " miss left" : " misses left"); }
  const names = c.habits.map(id => { const h = habitBy(id); return h ? h.label : ""; }).filter(Boolean).join(" / ");
  return `<div class="chal${tone}">
    <div class="chal-top"><span class="chal-n">${esc(c.name)}</span>
      <span class="chal-d">${st.left > 0 ? st.left + "D LEFT" : "OVER"}</span></div>
    <div class="chal-bar"><i style="width:${pct}%"></i></div>
    <div class="chal-l">${esc(line)}</div>
    <div class="chal-sub">${esc(names)} \u00b7 ${c.need} of ${c.days} days</div>
    <div class="chal-acts">
      <button class="chal-b" data-act="chaledit" data-id="${c.id}">EDIT</button>
      ${(st.gone || st.won) ? `<button class="chal-b" data-act="chalrestart" data-id="${c.id}">RESTART</button>` : ""}
      <button class="chal-b" data-act="chaldrop" data-id="${c.id}">DROP</button></div>
  </div>`;
}
function saveChal(){
  const d = S.draft; if(!d || !d.id) return;
  const c = S.chals.find(x => x.id === d.id); if(!c) return;
  const live = d.habits.filter(id => habitBy(id));
  if(!live.length){ toast("Pick at least one thing."); return; }
  c.name   = (d.name || "").trim().slice(0,28) || c.name;
  c.habits = live;
  c.mode   = live.every(id => habitBy(id).kind === "slip") ? "avoid" : "do";
  c.days   = Math.min(365, Math.max(1, d.days));
  c.need   = Math.min(c.days, Math.max(1, d.need));
  /* start is deliberately untouched — banked days survive the edit */
  S.draft = null; S.dayPane = "list"; toast("Saved. Your days stayed."); render();
}
function chalRestart(id){
  const c = S.chals.find(x => x.id === id); if(!c) return;
  if(!window.confirm('Reset "' + c.name + '" to start today? Days already banked are cleared.')) return;
  c.start = todayStamp(); S.draft = null; S.dayPane = "list"; toast("Clock reset."); render();
}
function chalDrop(id){
  const c = S.chals.find(x => x.id === id); if(!c) return;
  if(!window.confirm('Drop "' + c.name + '"? Your daily marks stay.')) return;
  bury("chals", id); S.chals = S.chals.filter(x => x.id !== id); render();
}
function makeChal(name, ids, days, need){
  const live = ids.filter(id => habitBy(id));
  if(!live.length) return false;
  const mode = live.every(id => habitBy(id).kind === "slip") ? "avoid" : "do";
  const cid = uid("c");
  S.chals.push({ id:cid, name:name, habits:live, mode:mode,
                 days:days, need:Math.min(days, Math.max(1, need)), start:todayStamp() });
  stamp("chals", cid);
  return true;
}
function useTemplate(key){
  const t = CHAL_TEMPLATES.find(x => x.key === key); if(!t) return;
  t.habits.forEach(id => {
    if(habitBy(id)) return;
    const d = DEFAULT_HABITS.find(x => x.id === id);
    if(d) S.habits.push(Object.assign({}, d));
  });
  makeChal(t.name, t.habits, t.days, t.need);
  S.dayPane = "list"; toast("Challenge started \u2014 " + t.name + "."); render();
}

function segCount(h){

function soFar(iso){
  const live = S.habits, evs = S.events[iso] || [];
  const doneN = live.filter(h => hval(iso, h.id) >= hitBar(h) && h.kind !== "slip").length
              + evs.filter(e => e.done).length;
  const totN  = live.filter(h => h.kind !== "slip").length + evs.length;
  const water = live.find(h => h.id === "h_water") || live.find(h => (h.unit||"").toLowerCase() === "cups");
  const walk  = live.find(h => h.id === "h_dog");
  const food  = logOf(iso).filter(e => e.kind === "eat").length;
  const slips = live.filter(h => h.kind === "slip" && hval(iso, h.id) > 0).length;
  const line = (val, label, fill, tot, slip) => `<div class="srow${slip ? " slip" : ""}">
    <b>${val}</b><span>${label}</span><div class="mini">${
      Array.from({length:tot}, (_,i) => `<i class="${i < fill ? "on" : ""}"></i>`).join("")}</div></div>`;
  return `<div class="sofar">
    <div class="sfh"><span>So far</span><i>TODAY</i></div>

        hval(iso,water.id), Math.max(2, Math.min(12, water.goal || 8))) : ""}
    ${line(String(food), "Food", Math.min(5, food), 5)}
    ${walk ? line(String(hval(iso,walk.id)), "Walks", hval(iso,walk.id), Math.max(2, walk.goal || 2)) : ""}
    ${line(String(slips), "Slips", slips, Math.max(3, S.habits.filter(h => h.kind === "slip").length), true)}
  </div>`;
}
function dayStrip(h, endIso){
  let out = "";
  for(let i = 13; i >= 0; i--){
    const iso = isoShift(endIso, -i);
    const v = hval(iso, h.id), on = v > 0, hit = v >= hitBar(h);
    out += `<i class="hc${on ? (h.kind === "slip" ? " slip" : (hit ? " on" : " part")) : ""}${iso > todayStamp() ? " fut" : ""}"></i>`;
  }
  return out;
}

function renamePart(id){
  const p = partList().find(x => x.id === id); if(!p) return;
  const t = window.prompt('Rename "' + p.label + '" \u2014 or clear it to remove the stretch', p.label);
  if(t === null) return;
  const label = String(t).trim().slice(0,16);
  if(label){ p.label = label; stamp("parts", p.id); render(); return; }
  if(partList().length <= 1){ toast("Keep at least one stretch."); return; }
  if(habitsIn(id).length && !window.confirm("Its things move to ANY TIME. Remove it?")) return;
  S.habits.forEach(h => { if(h.part === id) h.part = "any"; });
  Object.keys(S.events || {}).forEach(k => { S.events[k] = S.events[k].filter(e => e.part !== id); });
  const i = partList().findIndex(x => x.id === id);
  const prev = partList()[i-1], next = partList()[i+1];
  if(prev && next) prev.to = next.from; else if(prev) prev.to = 29; else if(next) next.from = 5;
  bury("parts", id);
  S.parts = partList().filter(x => x.id !== id);
  render();
}
function addPart(){
  const t = window.prompt("Name the stretch \u2014 e.g. After work", "");
  if(t === null) return;
  const label = String(t).trim().slice(0,16);
  if(!label) return;
  const arr = partList(), last = arr[arr.length - 1];
  const cut = Math.min(28, Math.max(last.from + 1, Math.round((last.from + last.to) / 2)));
  const np = { id:uid("p"), label, from:cut, to:last.to };
  last.to = cut;
  S.parts = arr.concat([np]);
  stamp("parts", np.id);
  render();
}

let UID_N = 0;
function uid(prefix){

/* =================================================================
   SYNC — one JSON mailbox, no account. The device stays the source
   of truth; the mailbox just carries changes between devices.
   Everything goes through syncNow(); swap the transport and the
   merge below is untouched.
   S.sync { url, key, last, at, on }
   S.mt   { "notes:id": ts }   when each thing last changed here
   S.tomb { "notes:id": ts }   when each thing was deleted here
   ================================================================= */
const SYNC_KEYS = ["notes","wins","habits","cats","states","parts","chals"];
function stamp(kind, id){ S.mt[kind + ":" + id] = Date.now(); }
function bury(kind, id){
  const k = kind + ":" + id;
  S.tomb[k] = Date.now();
  delete S.mt[k];
}
function mtOf(kind, id){ return +S.mt[kind + ":" + id] || 0; }
function tombOf(kind, id){ return +S.tomb[kind + ":" + id] || 0; }

/* every list merges the same way: keep both sides, newest edit wins,
   a delete only sticks if it happened after the other side's edit */
function mergeList(mine, theirs, myMt, myTomb, theirMt, theirTomb, kind){
  const out = new Map();
  mine.forEach(x => out.set(x.id, x));
  theirs.forEach(x => {
    const id = x.id;
    const tm = +theirMt[kind + ":" + id] || 0, td = +theirTomb[kind + ":" + id] || 0;
    const mm = +myMt[kind + ":" + id] || 0,   md = +myTomb[kind + ":" + id] || 0;
    if(md && md > tm && md > td) return;            /* I deleted it, more recently */
    if(td && td > mm){ out.delete(id); return; }    /* they deleted it, more recently */
    if(!out.has(id) || tm > mm) out.set(id, x);     /* theirs is newer, or new to me */
  });
  /* their deletions have to be applied to things only I still hold — walking
     their list alone would let a deleted item live on here forever */
  Object.keys(theirTomb || {}).forEach(k => {
    if(k.indexOf(kind + ":") !== 0) return;
    const id = k.slice(kind.length + 1);
    const td = +theirTomb[k] || 0, mm = +myMt[k] || 0;
    if(td > mm) out.delete(id);
  });
  return [...out.values()];
}
/* date-keyed maps (taps, food log, one-off events) merge a day at a time */
function mergeByDay(mine, theirs, myMt, theirMt, kind){
  const out = Object.assign({}, mine);
  Object.keys(theirs || {}).forEach(d => {
    const tm = +theirMt[kind + ":" + d] || 0, mm = +myMt[kind + ":" + d] || 0;
    if(!(d in out) || tm > mm) out[d] = theirs[d];
  });
  return out;
}
function mergeState(theirs){
  if(!theirs || typeof theirs !== "object") return false;
  const tMt = theirs.mt || {}, tTomb = theirs.tomb || {};
  SYNC_KEYS.forEach(k => {
    if(!Array.isArray(theirs[k])) return;
    S[k] = mergeList(S[k] || [], theirs[k], S.mt, S.tomb, tMt, tTomb, k);
  });
  S.day    = mergeByDay(S.day,    theirs.day,    S.mt, tMt, "day");
  S.log    = mergeByDay(S.log,    theirs.log,    S.mt, tMt, "log");
  S.events = mergeByDay(S.events, theirs.events, S.mt, tMt, "events");
  if(theirs.lift && typeof theirs.lift === "object"){
    ["done","sets","wt","up"].forEach(sub => {
      S.lift[sub] = Object.assign({}, S.lift[sub], theirs.lift[sub] || {});
    });
  }
  /* plain settings: whichever device touched them last */
  const tSet = +tMt["settings"] || 0, mSet = +S.mt["settings"] || 0;
  if(tSet > mSet){
    ["wallName","accent","groupBy","doneSort"].forEach(k => {
      if(theirs[k] !== undefined) S[k] = theirs[k];
    });
    S.mt["settings"] = tSet;
  }
  S.mt   = Object.assign({}, tMt, S.mt);
  S.tomb = Object.assign({}, tTomb, S.tomb);
  return true;
}
function syncPayload(){
  const p = snapshot();
  p.mt = S.mt; p.tomb = S.tomb; p.rev = Date.now();
  return p;
}
function stableStr(v){
  /* key order changes every merge, so sort it or the fingerprint is noise */
  if(v === null || typeof v !== "object") return JSON.stringify(v);
  if(Array.isArray(v)) return "[" + v.map(stableStr).join(",") + "]";
  return "{" + Object.keys(v).sort().map(k => JSON.stringify(k) + ":" + stableStr(v[k])).join(",") + "}";
}
function syncFingerprint(p){
  const c = Object.assign({}, p);
  /* volatile by nature: a save stamp and the sync clock change every call
     and would make every idle sync look like a change */
  delete c.rev; delete c.sync; delete c.saved;
  const str = stableStr(c);
  let h = 5381;
  for(let i = 0; i < str.length; i++) h = ((h * 33) ^ str.charCodeAt(i)) >>> 0;
  return str.length + ":" + h.toString(36);
}
async function syncNow(quiet){
  const cfg = S.sync || {};
  if(!cfg.url || !cfg.key){ if(!quiet) toast("Set up sync first."); return false; }
  if(S.syncing) return false;
  S.syncing = true; if(!quiet) paintSync("Syncing\u2026");
  try {
    const get = await fetch(cfg.url + "?key=" + encodeURIComponent(cfg.key), { cache:"no-store" });
    if(get.ok){
      const text = await get.text();
      if(text && text.trim()){ try { mergeState(JSON.parse(text)); } catch(e){} }
    }
    const payload = syncPayload();
    const fp = syncFingerprint(payload);
    if(fp !== S.syncFp){
      const put = await fetch(cfg.url + "?key=" + encodeURIComponent(cfg.key), {
        method:"POST", headers:{ "Content-Type":"application/json" },
        body: JSON.stringify(payload)
      });
      if(!put.ok) throw new Error("put " + put.status);
      S.syncFp = fp;
      S.syncWrites = (S.syncWrites || 0) + 1;
    }
    S.sync.at = Date.now();
    S.syncing = false; persist(); render();
    if(!quiet) toast("Synced.");
    return true;
  } catch(e){
    S.syncing = false;
    paintSync("Offline \u2014 will retry");
    if(!quiet) toast("Couldn't reach the mailbox.");
    return false;
  }
}
function paintSync(msg){
  const el = $("#syncState");
  if(el) el.textContent = msg;
}
function paintSyncRow(){
  const on = !!(S.sync && S.sync.url && S.sync.key);

  const b = $("#syncSetupBtn");
  if(b) b.textContent = on ? "CHANGE" : "SET UP";

function syncAgo(){
  if(!S.sync || !S.sync.at) return "never";
  const m = Math.round((Date.now() - S.sync.at) / 60000);
  return m < 1 ? "just now" : m < 60 ? m + "m ago" : Math.round(m/60) + "h ago";
}

      : `<div class="chal empty">Nothing running. A challenge is <b>X days out of N</b> \u2014
         miss one and you've spent a miss, not the run.
         <button class="chal-b" data-act="chaltpl" style="margin-top:9px">PICK ONE</button></div>`}

    <div class="endwall">\u00b7\u00b7\u00b7 TAP IT AND FORGET IT \u00b7\u00b7\u00b7</div>

const ACCENTS = ["#14110F","#D0342A","#ED8016","#D9B310",
                 "#14A06B","#0E9BC4","#3D5AE0","#A93C9B"];
const ACCENT_NAMES = ["Ink","Vermilion","Amber","Brass","Emerald","Lagoon","Cobalt","Mulberry"];
/* a segmented wheel — 24 hues around, three depths out, plus a neutral bar.
   Nothing to type, and every swatch still sits on the paper. */
function hsl2hex(h, sPct, lPct){
  const sN = sPct/100, lN = lPct/100;
  const k = n => (n + h/30) % 12;
  const a = sN * Math.min(lN, 1 - lN);
  const f = n => Math.round(255 * (lN - a * Math.max(-1, Math.min(k(n)-3, Math.min(9-k(n), 1)))));
  return "#" + [f(0),f(8),f(4)].map(v => v.toString(16).padStart(2,"0")).join("");
}
function accentWheel(){
  const SEG = 24, C = 132, RINGS = [[128,102],[102,76],[76,50]];
  const DEPTH = [[84,50],[80,36],[72,66]];   /* sat, light per ring — outer vivid,
                                                mid deep, inner light */
  const pol = (r, deg) => {
    const a = (deg - 90) * Math.PI / 180;
    return [(C + r*Math.cos(a)).toFixed(2), (C + r*Math.sin(a)).toFixed(2)];
  };
  let out = "";
  RINGS.forEach(([r1, r0], ri) => {
    const [sat, lig] = DEPTH[ri];
    for(let i = 0; i < SEG; i++){
      const a0 = i * (360/SEG), a1 = a0 + (360/SEG) - 0.6;
      const hex = hsl2hex(Math.round(a0 + 7), sat, lig);
      const [x1,y1] = pol(r1,a0), [x2,y2] = pol(r1,a1);
      const [x3,y3] = pol(r0,a1), [x4,y4] = pol(r0,a0);
      out += `<path d="M${x1} ${y1} A${r1} ${r1} 0 0 1 ${x2} ${y2} L${x3} ${y3} A${r0} ${r0} 0 0 0 ${x4} ${y4} Z"
        fill="${hex}" data-act="accent" data-c="${hex}"/>`;
    }
  });
  const cur = S.accent || "#14110F";
  return `<div class="wheelwrap">
    <svg viewBox="0 0 264 264" class="wheel">${out}
      <circle cx="132" cy="132" r="49" fill="${cur}"/>
      <circle cx="132" cy="132" r="49" fill="none" stroke="#F8F5EF" stroke-width="2"/>
    </svg>
    <div class="neutrals">${["#14110F","#3A3833","#6E6A63","#9A958C","#C2BDB2","#F0EBE1"].map(c =>
      `<button class="nsw" data-act="accent" data-c="${c}" style="background:${c}"></button>`).join("")}</div>
  </div>`;
}
function relLum(hex){
  const n = parseInt(hex.slice(1),16);
  const f = v => { v /= 255; return v <= 0.03928 ? v/12.92 : Math.pow((v+0.055)/1.055, 2.4); };
  return 0.2126*f(n>>16 & 255) + 0.7152*f(n>>8 & 255) + 0.0722*f(n & 255);
}
function contrast(a, b){
  const x = relLum(a), y = relLum(b);
  return (Math.max(x,y) + 0.05) / (Math.min(x,y) + 0.05);
}
function readable(hex){
  /* pick whichever actually reads better, not a brightness guess — a bright
     amber needs ink even though it isn't "light" by the old threshold */
  return contrast(hex, "#111111") >= contrast(hex, "#F8F5EF") ? "#111111" : "#F8F5EF";
}
function paintAccent(){
  const a = S.accent || "#111111";
  document.documentElement.style.setProperty("--accent", a);
  document.documentElement.style.setProperty("--accent-ink", readable(a));
  const box = $("#swatches");
  if(!box) return;
  const preset = ACCENTS.some(c => c.toLowerCase() === a.toLowerCase());
  box.innerHTML = ACCENTS.map((c,i) =>
      `<button class="sw${c.toLowerCase() === a.toLowerCase() ? " on" : ""}" data-act="accent"
         data-c="${c}" style="background:${c}" title="${ACCENT_NAMES[i]}"></button>`).join("")
    + `<button class="sw more${preset ? "" : " on"}" data-act="accentwheel"
         style="background:${preset ? "transparent" : a}">${preset ? "\u25CF\u25CF\u25CF" : ""}</button>`
    + (S.wheelOpen ? accentWheel() : "");
}
function mountAccent(){ /* the wheel is delegated like everything else */ }
function render(){
  renderPlate(); renderTabs(); renderLede(); renderNotes(); renderFolders(); renderLegend(); renderLayer();
  paintAccent(); mountAccent(); mountWins(); paintSyncRow();
  /* the RIGHT NOW card reads the clock, so keep it honest */
  if(!window.__nowTick) window.__nowTick = setInterval(() => {
    if(document.hidden) return;
    if(S.view !== "day" || S.dayPane !== "list") return;
    if(S.padOpen || S.swap) return;
    render();
  }, 60000);
  paintReadout(); paintSaveState(); persist();
}

/* =================================================================
   SESSION LOG — paste the block ChatGPT writes when you say "log it".
   One paste updates the whole file: thread, decisions, questions,
   blocker, next move, signals. No field-by-field clicking.
   ================================================================= */
const GPT_INSTRUCTION = `When I say "log it", end your reply with exactly this block, filled from this session:

WALL-IT LOG
Project: <project name>
Thread: <the exact question or line of work I am in the middle of, one sentence>
Decided:
- <each decision made this session that should not be reopened>
Open:
- <each question still genuinely unresolved>
Blocker: <the one thing stopping progress, or "none">
Next: <the single best next action, imperative, under 14 words>
Notes:
- <any other meaningful signal worth remembering>

Rules: plain text only, keep every header even if its section is empty, one item per dash, never invent items.`;

function parseLog(raw){
  const out = { project:null, thread:null, decided:[], open:[], blocker:undefined, next:null, notes:[] };
  let sec = null;
  const item = (t) => t.replace(/^[-•*\d.)\s]+/,"").trim();
  raw.replace(/\r/g,"").split("\n").forEach(ln => {
    const t = ln.trim();
    if(!t || /^(mike\s*os|wall[\s-]?it)\s*log$/i.test(t)) return;
    const head = t.match(/^(project|thread|decided|decisions?|open questions?|questions?|open|blocked on|blocker|next move|next|notes|signals?)\s*:\s*(.*)$/i);
    if(head){
      const key = head[1].toLowerCase(), val = head[2].trim();
      if(key === "project"){ out.project = val; sec = null; }
      else if(key === "thread"){ if(val) out.thread = val; sec = "thread"; }
      else if(key.startsWith("decided") || key.startsWith("decision")){ sec = "decided"; if(val) out.decided.push(val); }
      else if(key === "open" || key.indexOf("question") >= 0){ sec = "open"; if(val) out.open.push(val); }
      else if(key === "blocker" || key === "blocked on"){ out.blocker = val; sec = "blocker"; }
      else if(key === "next" || key === "next move"){ if(val) out.next = val; sec = "next"; }
      else { sec = "notes"; if(val) out.notes.push(val); }
      return;
    }
    const v = item(t);
    if(!v) return;
    if(sec === "decided") out.decided.push(v);
    else if(sec === "open") out.open.push(v);
    else if(sec === "notes") out.notes.push(v);
    else if(sec === "thread") out.thread = out.thread ? out.thread + " " + v : v;
    else if(sec === "blocker") out.blocker = (out.blocker ? out.blocker + " " : "") + v;
    else if(sec === "next"){ if(!out.next) out.next = v; }
    else out.notes.push(v);
  });
  return out;
}

function matchProjectByName(name){
  if(!name) return null;
  const q = name.trim().toLowerCase();
  if(!q) return null;
  return S.projects.find(p => p.name.toLowerCase() === q)
      || S.projects.find(p => p.name.toLowerCase().includes(q) || q.includes(p.name.toLowerCase()))
      || null;
}

function applyLog(id, L){
  const p = byId(id), stamp = todayStamp();
  let changes = 0;
  if(L.thread && L.thread !== p.thread){ p.thread = L.thread; changes++; }
  if(L.next && L.next !== p.nextMove){ p.nextMove = L.next; changes++; }
  const bl = (L.blocker || "").trim();
  if(bl){
    if(/^(none|nothing|no|clear|n\/a|-)\.?$/i.test(bl)){
      if(p.blocker){ p.blocker = null; if(p.state === "blocked") p.state = "active"; changes++; }
    } else if(bl !== p.blocker){ p.blocker = bl; p.state = "blocked"; changes++; }
  }
  L.decided.forEach(d => { if(!p.decisions.some(x => x.text === d)){ p.decisions.unshift({ date:stamp, text:d }); changes++; } });
  L.open.forEach(q => { if(!p.openQuestions.includes(q)){ p.openQuestions.unshift(q); changes++; } });
  L.notes.forEach(n2 => { p.signals.unshift({ date:stamp, kind:"signal", text:n2 }); changes++; });
  p.signals.unshift({ date:stamp, kind:"thread", text:"Session logged." });
  p.lastTouched = stamp;
  if(p.momentum === "dormant") p.momentum = "fading";
  delete S.resumes[p.id];
  render();
  toast(changes + (changes === 1 ? " update" : " updates") + " filed on " + p.name + ".");
}

    const id = sel.value;

/* =================================================================
   QUICK CAPTURE — the prefix decides what the note becomes
   ================================================================= */
const PREFIX = [
  { key:"thread",   glyph:"@", label:"Thread",    effect:"Replaces the thread and marks the file touched." },
  { key:"decision", glyph:"~", label:"Decision",  effect:"Adds to settled — future resumes won't re-litigate it." },
  { key:"question", glyph:"?", label:"Question",  effect:"Adds to open questions." },
  { key:"blocker",  glyph:"!", label:"Blocker",   effect:"Sets the blocker and moves the file to Blocked." },
  { key:"move",     glyph:">", label:"Next move", effect:"Replaces the next move." },
  { key:"signal",   glyph:"·", label:"Signal",    effect:"Logs a signal on the timeline." }
];
function parseCapture(raw){
  const t = raw.trim();
  const hit = PREFIX.find(p => p.glyph !== "·" && t.startsWith(p.glyph));
  return { kind: hit ? hit.key : "signal", text: hit ? t.slice(1).trim() : t };
}
function mountCapture(){
  const wrap = document.createElement("div");
  wrap.innerHTML = `
    <div class="scrim" data-act="closemodal"></div>
    <div class="modal" role="dialog" aria-label="Quick capture">

          `<option value="${p.id}" ${p.id===(S.captureTarget||S.projects[0].id)?"selected":""}>${esc(p.name)}</option>`).join("")}</select>

        <span class="hint" id="capEffect" style="text-transform:none"></span><span class="grow"></span>
        <button class="btn" data-act="closemodal">Cancel</button>
        <button class="btn primary" id="capCommit">File it <span class="kbd">⌘↵</span></button></div>
    </div>`;
  $("#layer").append(...wrap.childNodes);
  const ta = $("#capText"), pills = $("#capPills"), effect = $("#capEffect"), commitBtn = $("#capCommit");
  S.captureTarget = S.captureTarget || S.projects[0].id;
  const paint = () => {
    const parsed = parseCapture(ta.value);
    pills.innerHTML = PREFIX.map(p =>
      `<span class="pill ${p.key===parsed.kind?"on":""}">${p.glyph} ${p.label}</span>`).join("");
    effect.textContent = PREFIX.find(p=>p.key===parsed.kind).effect;
    commitBtn.disabled = !parsed.text;
  };
  const commit = () => {
    const parsed = parseCapture(ta.value);
    if(!parsed.text) return;
    commitCapture(S.captureTarget, parsed);
    closeModal();
  };
  ta.addEventListener("input", paint);
  ta.addEventListener("keydown", e => {
    if(e.key==="Enter" && (e.metaKey||e.ctrlKey)){ e.preventDefault(); commit(); }
    if(e.key==="Escape") closeModal();
  });
  $("#capTarget").addEventListener("change", e => { S.captureTarget = e.target.value; });
  commitBtn.addEventListener("click", commit);
  paint(); ta.focus();
}
function commitCapture(id, parsed){
  const stamp = todayStamp(), p = byId(id);
  p.lastTouched = stamp;
  p.signals.unshift({ date:stamp, kind:parsed.kind, text:parsed.text });
  if(parsed.kind==="thread"){ p.thread = parsed.text; if(p.momentum==="dormant") p.momentum = "fading"; }
  if(parsed.kind==="move") p.nextMove = parsed.text;
  if(parsed.kind==="blocker"){ p.blocker = parsed.text; p.state = "blocked"; }
  if(parsed.kind==="decision") p.decisions.unshift({ date:stamp, text:parsed.text });
  if(parsed.kind==="question") p.openQuestions.unshift(parsed.text);
  delete S.resumes[p.id];
  render();
  toast(KIND[parsed.kind].label+" filed on "+p.name+".");
}

function createProject({ name, vision, thread, nextMove, state, url }){
  const stamp = todayStamp();
  let id = name.toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"") || "file";
  if(byId(id)) id += "-"+Date.now().toString().slice(-4);
  const first = nextMove || "Decide the first concrete move.";
  const kind = url ? kindFromUrl(url) : null;
  const p = {
    id, name,
    state, momentum:"building", lastTouched:stamp, weight:.55,
    vision: vision || "Not written yet.",
    mission: "Not set yet — decide what finishing this phase looks like.",
    thread: thread || "Just opened. Nothing worked through yet.",
    blocker: state==="blocked" ? "Not described yet." : null,
    nextMove: first,
    decisions: [], openQuestions: [],
    signals: [{ date:stamp, kind:"signal", text:"Folder opened." }],
    links: url ? [{ label: kind==="claude"?"Claude thread":kind==="chatgpt"?"ChatGPT thread":"Workspace",
                    kind, url }] : [],
    resume: {
      confidence:"low",
      stopped: thread || "Nothing worked through yet — the file was just opened.",
      reconstruction: "A new file with only what you wrote when you opened it. There is no history to reconstruct yet, so treat the next action as a guess until you have worked on it once.",
      settled: [], unresolved: [], nextAction: first,
      ninety: "Spend the time writing down what finishing the current phase would look like."
    }
  };
  S.projects.push(p);
  closeModal();
  openProject(id);
  toast(name+" filed.");
}

function setState(id, state){
  const p = byId(id);
  if(p.state === state) return;
  const stamp = todayStamp();
  p.state = state;
  if(state !== "blocked") p.blocker = null;
  if(state === "parked" || state === "complete") p.momentum = "dormant";
  p.signals.unshift({ date:stamp, kind:"signal", text:"Moved to "+STATE[state].label+"." });
  p.lastTouched = stamp;
  S.open[groupOf(p, ranked()[0].id)] = true;
  render();

/* Bulk paste: Taskade lines in, notes out. Reads the color emoji as the
   status, strips checkboxes/markdown, skips headers, dedupes. */
const NOTE_EMOJI = { "\u{1F534}":"priority", "\u{1F535}":"workon", "\u{1F7E2}":"doit",
  "\u{1F7E0}":"pending", "\u{1F7E1}":"inprocess", "\u{1F7E3}":"stagnant",
  "\u26AB":"idea", "\u26AA":"idea" };
function parseNoteList(raw, fallback){
  const out = [];
  raw.replace(/\r/g,"").split("\n").forEach(ln => {
    let t = ln.trim();
    if(!t || /^#/.test(t)) return;
    t = t.replace(/^[-*]\s*\[[ xX]?\]\s*/,"").replace(/^[-*\u2022]\s+/,"");
    let status = fallback;
    for(const e in NOTE_EMOJI){
      if(t.startsWith(e)){ status = NOTE_EMOJI[e]; t = t.slice(e.length).trim(); break; }
    }
    t = t.replace(/\[([^\]]+)\]\(([^)]+)\)/g,"$1 $2").replace(/\*\*/g,"").trim();
    if(t) out.push({ text:t, status });
  });
  return out;
}

function normalize(p){

  p.signals = p.signals||[]; p.links = p.links||[];
  p.state = STATE[p.state] ? p.state : "active";
  p.momentum = MOMENTUM[p.momentum] ? p.momentum : "steady";
  p.weight = typeof p.weight === "number" ? p.weight : .5;
  p.lastTouched = /^\d{4}-\d{2}-\d{2}$/.test(p.lastTouched||"") ? p.lastTouched : todayStamp();
  p.vision = p.vision || "Not written yet.";
  p.mission = p.mission || "Not set yet.";
  p.thread = p.thread || "Nothing worked through yet.";
  p.nextMove = p.nextMove || "Decide the first concrete move.";
  p.resume = p.resume || { confidence:"low", stopped:p.thread,
    reconstruction:"No history recorded for this file yet.",
    settled:[], unresolved:[], nextAction:p.nextMove,
    ninety:"Write down what finishing the current phase would look like." };

  seedCats();
  S.states = (Array.isArray(data.states) ? data.states : [])
    .filter(x => x && x.id && x.label)
    .map(x => ({ id:String(x.id), label:String(x.label).slice(0,14).toUpperCase(),
                 sub:String(x.sub || "").slice(0,26),
                 hex:/^#[0-9a-fA-F]{6}$/.test(x.hex || "") ? x.hex : "#6E6A63",
                 w:Number.isFinite(+x.w) ? Math.max(0, Math.min(30, +x.w)) : 10 }));
  seedStates();
  S.groupBy = ["section","all"].includes(data.groupBy) ? data.groupBy : "state";
  S.wallName = String(data.wallName || "Your Wall").slice(0,24) || "Your Wall";

  S.open = Object.assign({}, S.open, data.open||{});
  S.rows = data.rows||{}; S.clips = data.clips||{}; S.resumes = data.resumes||{};
  S.gravity = ["status","category","age"].includes(data.gravity) ? data.gravity : "status";
  S.view = ["notes","map","files","archive","day","lift","wins"].includes(data.view) ? data.view : "notes";
  S.accent = /^#[0-9a-fA-F]{6}$/.test(data.accent || "") ? data.accent : "#111111";
  S.swapOff = Array.isArray(data.swapOff) ? data.swapOff.map(String).slice(0,40) : [];
  const L = (data.lift && typeof data.lift === "object") ? data.lift : {};

  Object.keys(L.wt || {}).forEach(e => { const v = +L.wt[e]; if(v >= 0 && v < 2000) S.lift.wt[String(e)] = v; });
  Object.keys(L.up || {}).forEach(e => { const v = Math.round(+L.up[e]); if(v > 0) S.lift.up[String(e)] = Math.min(9, v); });
  S.wins = (Array.isArray(data.wins) ? data.wins : [])

  S.events = {};

  S.log = {};
  const rawLog = (data.log && typeof data.log === "object") ? data.log : {};

  Object.keys(rawLog).forEach(k => {
    if(!/^\d{4}-\d{2}-\d{2}$/.test(k) || k < floor) return;   /* 60 days, then it goes */
    const rows = (Array.isArray(rawLog[k]) ? rawLog[k] : []).filter(e => e && e.id).map(e => ({
      id:String(e.id), ts:+e.ts || 0,
      kind:["water","walk","workout","eat","note"].includes(e.kind) ? e.kind : "note",
      text:String(e.text || "").slice(0,64), oz:+e.oz || 0, min:+e.min || 0,

  S.habits = (Array.isArray(data.habits) ? data.habits : []).filter(h => h && h.id && h.label)
    .map(h => ({ id:String(h.id), label:String(h.label).slice(0,32),
      kind: h.kind === "slip" ? "slip" : "good",
      mode: ["check","count","num"].includes(h.mode) ? h.mode : "check",
      part: PART_IDS.includes(h.part) ? h.part : "any",
      ord: Number.isFinite(+h.ord) ? +h.ord : undefined,
      unit: String(h.unit || "").slice(0,16),
      goal: Number.isFinite(+h.goal) && +h.goal > 0 ? Math.min(999999, Math.round(+h.goal)) : 0 }));
  if(!S.habits.length) S.habits = DEFAULT_HABITS.map(h => Object.assign({}, h));
  S.day = {};
  const rawDay = (data.day && typeof data.day === "object") ? data.day : {};
  Object.keys(rawDay).forEach(k => {
    if(!/^\d{4}-\d{2}-\d{2}$/.test(k)) return;
    const src = rawDay[k] || {}, out = {};
    Object.keys(src).forEach(id => { const v = Math.round(+src[id]); if(v > 0) out[id] = Math.min(999999, v); });
    if(Object.keys(out).length) S.day[k] = out;
  });
  S.chals = (Array.isArray(data.chals) ? data.chals : [])
    .filter(c => c && c.id && Array.isArray(c.habits) && c.habits.length && /^\d{4}-\d{2}-\d{2}$/.test(c.start||""))
    .map(c => { const days = Math.min(365, Math.max(1, Math.round(+c.days) || 30));
      return { id:String(c.id), name:String(c.name || "Challenge").slice(0,28),
        habits:c.habits.map(String), mode: c.mode === "avoid" ? "avoid" : "do",
        days:days, need:Math.min(days, Math.max(1, Math.round(+c.need) || days)), start:c.start }; });
  S.notes = (Array.isArray(data.notes) ? data.notes : []).filter(n => n && n.id && n.text)
    .map(n => ({ id:n.id, text:String(n.text),
      ord: Number.isFinite(+n.ord) ? +n.ord : undefined,
      status: NOTE_STATUS[n.status] ? n.status : (NOTE_LEGACY[n.status] || "workon"),
      cat: CAT[n.cat] ? n.cat : guessCat(String(n.text)),
      date: /^\d{4}-\d{2}-\d{2}$/.test(n.date||"") ? n.date : todayStamp(),
      due: /^\d{4}-\d{2}-\d{2}$/.test(n.due||"") ? n.due : null,
      dueTime: n.dueTime || null,
      dueScanned: !!n.dueScanned,
      lead: Math.max(0, parseInt(n.lead, 10) || 0),
      touched: /^\d{4}-\d{2}-\d{2}$/.test(n.touched||"") ? n.touched : null }));
  if(!byId(S.captureTarget)) S.captureTarget = S.projects.length ? S.projects[0].id : null;
}

function spreadDate(status, i){
  const base = { pulling:4, radar:7, drifting:12, someday:30, outer:21, done:10 };
  const span = { pulling:24, radar:18, drifting:30, someday:45, outer:70, done:20 };
  const days = (base[status]||10) + ((i*7) % (span[status]||20));
  const d = new Date(TODAY); d.setDate(d.getDate() - days);
  return d.toISOString().slice(0,10);
}
function seedNotes(){
  seedCats(); seedStates();
  S.notes = SEED_NOTES.map((r,i) => {
    const st = NOTE_LEGACY[r[0]] || (NOTE_STATUS[r[0]] ? r[0] : "workon");
    return { id:"seed"+i, text:r[1], status:st, cat:guessCat(r[1]), date:spreadDate(st, i) };
  });
}
function restore(){
  storageProbe();
  if(!STORE.ok){ seedNotes(); seedProjects(); return; }
  try {
    const raw = window.localStorage.getItem(KEY);
    if(!raw){ seedNotes(); seedProjects(); return; }
    adopt(JSON.parse(raw));
    STORE.last = new Date();
    // an older drawer missing either half shouldn't hide the starters
    if(!S.notes.length) seedNotes();
    // seed artifact: if nearly every note shares one date, ages are fake — respread them
    const dset = {};
    S.notes.forEach(n => { dset[n.date] = 1; });
    if(S.notes.length > 10 && Object.keys(dset).length <= 2)
      S.notes.forEach((n,i) => { n.date = spreadDate(n.status, i); });
    if(!S.projects.length) seedProjects();
  } catch(e){
    STORE.note = "Saved drawer couldn't be read, so this is a fresh one. Your backup file still works.";
  }
}

  if(!STORE.ok){ el.textContent = "session only"; el.classList.add("warn"); }
  else { el.textContent = STORE.last ? "saved" : "ready"; el.classList.remove("warn"); }

function exportBackup(){
  try {
    const blob = new Blob([JSON.stringify(snapshot(),null,2)], { type:"application/json" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "wall-it-"+todayStamp()+".json";
    document.body.append(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(a.href), 2000);
    toast("Backup downloaded.");
  } catch(e){ toast("Couldn't build the backup file."); }
}
function importBackup(file){

    try { adopt(JSON.parse(r.result)); persist(); render(); toast(S.projects.length+" files imported."); }
    catch(e){ toast("That file isn't a Wall-It backup."); }
  };
  r.onerror = () => toast("Couldn't read that file.");
